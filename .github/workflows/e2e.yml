# Clean-machine half of the pre-ship gate (issue #38, narrowed by #1041).
#
# This job runs `scripts/verify-before-ship.ps1` -- the same gate every lane
# runs locally before opening a PR -- on a runner that has never seen this
# repo: a fresh `.venv` installed from `requirements.txt`, against committed
# files only, at the commit rather than somebody's working tree. That is the
# half of the gate a local run structurally cannot do, and it catches the
# things it is here for: a file a lane forgot to commit, a dependency that
# only exists on the dev box, a test that passes only because of local state,
# and drift in an unpinned dependency (which is what #1041 turned out to be --
# `fastapi>=0.110` resolved to 0.136 locally and 0.141 here, and only the
# newer one broke the terminal-guard route walk).
#
# It deliberately does NOT run the Playwright browser suite. `e2e-gate-route.ps1`
# routes CI to tier "skip", so the gate stops after byte-compile + the non-e2e
# pytest suite. That leg was a second run of a gate that had already passed
# locally, and it needed three timeout widenings just to survive the hosted
# runner. The local gate is the contract for it -- see CLAUDE.md, "Verification".
#
# The workflow keeps its name (`e2e`) so the existing branch/PR checks and
# links keep resolving.
#
# windows-2025 is mandatory: pywinpty is Windows-only, and the non-e2e suite
# includes real-ConPTY tests. `verify-before-ship.ps1` hard-requires the venv
# interpreter under `.venv/Scripts/`, so the workflow creates `.venv` and
# installs into it -- the script is untouched.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-before-ship:
    runs-on: windows-2025
    # Typical green is ~4 min without the browser leg (deps ~1 min, the
    # ~2450-test non-e2e suite ~3 min). Bound it so a wedge fails fast (red)
    # instead of running to GitHub's 6 h ceiling, with headroom over the
    # typical so a merely-loaded runner isn't a false red.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Create .venv and install deps
        # The install itself is part of what this job checks: requirements.txt
        # must produce a working environment on a machine with nothing on it.
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Seed config files from committed samples
        # config.json / webapp_config.json / apps.json are gitignored -- only the
        # *.sample.json templates are checked in, and they carry no credential.
        # Kept after #1041 narrowed this job: the non-e2e suite has not been
        # proven independent of these files, and establishing that is its own
        # change rather than a second variable in this one.
        run: |
          Copy-Item config/config.sample.json config/config.json
          Copy-Item config/webapp_config.sample.json config/webapp_config.json
          Copy-Item config/apps.sample.json config/apps.json

      - name: Run pre-ship gate
        run: pwsh -File scripts/verify-before-ship.ps1

      - name: Upload gate progress log
        # Runs even when the gate fails: per-test START/DONE lines and the
        # slowest-test summary make a red diagnosable from the run page. The
        # e2e autoboot logs that used to be collected here no longer exist --
        # this job boots no webapp and no session-host.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-progress-log
          path: webapp/verify-progress.log
          if-no-files-found: warn
          retention-days: 7
