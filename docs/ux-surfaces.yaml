    area: lifeos
    title: Conversations group
    root: data-surface
    reach:
      - a skill's Conversations, or a search of two characters or more
    holds:
      - a Start new conversation button
      - a Relevance, Recent and Created switch
      - the conversations, each with its title and when it ran
      - Archived and System folds
    does:
      - a row opens the conversation sheet
    states:
      - a status line for loading, empty and failed
    links:
      - to: lifeos.convo-sheet
        via: a row
      - to: lifeos.archived
        via: Archived
      - to: lifeos.system
        via: System
      - to: lifeos.start-picker
        via: Start new conversation with no skill in scope

  - id: lifeos.archived
    area: lifeos
    title: Archived conversations
    root: data-surface
    reach:
      - the Archived fold in the Conversations group
    holds:
      - the conversations the skill has archived

  - id: lifeos.system
    area: lifeos
    title: System conversations
    root: data-surface
    reach:
      - the System fold in the Conversations group
    holds:
      - the conversations a Telegram bot or a job opened, kept apart from yours

  - id: lifeos.convo-sheet
    area: lifeos
    title: Conversation sheet
    root: data-surface
    reach:
      - tap a conversation row
      - a link to a conversation
    holds:
      - the conversation's title with a Rename button
      - Read, Start new, Open raw, Copy link and Delete
      - a model row that opens the resume model sheet
      - a Resume button and a toast area
    does:
      - Resume reopens it with the agent's own resume
      - Delete asks the confirm dialog
    states:
      - a conversation whose file is gone says so
    links:
      - to: lifeos.convo-viewer
        via: Read
      - to: lifeos.resume-model-sheet
        via: model row
      - to: lifeos.doc
        via: Open raw
      - to: chrome.confirm
        via: Delete

  - id: lifeos.resume-model-sheet
    area: lifeos
    title: Model for this resume
    root: data-surface
    reach:
      - the model row in the conversation sheet
    holds:
      - the models the agent can resume with
    does:
      - Done closes

  - id: lifeos.start-picker
    area: lifeos
    title: Start new in
    root: data-surface
    reach:
      - Start new conversation in the Conversations group when no skill is in scope
    holds:
      - every skill as a row with its avatar
    does:
      - a row starts a new conversation with that skill, on the toolbar's model
      - Done closes

  - id: lifeos.convo-viewer
    area: lifeos
    title: Conversation viewer
    root: data-surface
    reach:
      - Read in the conversation sheet
      - a link with a convo parameter, which also selects the Life tab
    holds:
      - the conversation as read-only chat cards
      - a Latest button that jumps to the end
    states:
      - a state line for loading, a missing file and a reader that is unavailable
    links:
      - to: lifeos.convo-sheet
        via: close returns to the sheet it opened under

  - id: lifeos.browser
    area: lifeos
    title: Skill browser
    root: data-surface
    reach:
      - Read in the skill menu
    holds:
      - the skill's files in a read-only list
    links:
      - to: lifeos.doc
        via: a file

  - id: lifeos.doc
    area: lifeos
    title: File viewer
    root: data-surface
    reach:
      - a file in the skill browser
      - Open raw in the conversation sheet
    holds:
      - the file's contents
      - Rename log and Delete log, for a log
    does:
      - Delete log asks the confirm dialog
    links:
      - to: chrome.confirm
        via: Delete log

  - id: lifeos.recap
    area: lifeos
    title: Weekly recap card
    root: data-surface
    reach:
      - the card under the skills; it rises above them while it is the exception, due, overdue or a draft ready
    holds:
      - a notebook avatar and when it last ran
    does:
      - a tap reviews the weekly recap

  # ---------------------------------------------------------------- settings
  - id: settings.pane
    area: settings
    title: Settings pane
    root: data-surface
    reach:
      - the gear in any page header
    holds:
      - "Activity: Screen time"
      - "Documents: the list of documents, with Retry when it could not be read"
      - "Appearance: Text size (Small, Default, Large) and Usage meter"
      - "Agents: Launch defaults and Chief"
      - "Sessions: Open in a new window and Open in Chat switches"
      - "Life OS: Refresh skills on resume switch"
      - "Dictation: Auto-stop (Off, 2 s, 3 s, 5 s)"
      - "Connections: Telegram, Context filter, Fleet scope, Inspiration, API tokens"
      - "This PC: Folders, Passkeys, Terminal, PC load, and the Start at log on, Hide shut down remotely and Awake with lid closed switches"
      - Voice, in a Remote Desktop session only
    does:
      - a row that shows a value opens its sheet; a switch saves when you tap it
      - tapping any tab leaves Settings
    states:
      - the Voice group is absent outside a Remote Desktop session
      - the lid and shut-down switches show a status line saying what Windows reported
    links:
      - to: settings.screen-time
        via: Screen time
      - to: settings.document
        via: a document
      - to: settings.usage-shows
        via: Usage meter
      - to: settings.launch-defaults
        via: Launch defaults
      - to: settings.chief
        via: Chief
      - to: settings.channels
        via: Telegram
      - to: settings.context-filter
        via: Context filter
      - to: settings.fleet-scope
        via: Fleet scope
      - to: settings.inspiration
        via: Inspiration
      - to: settings.tokens
        via: API tokens
      - to: settings.folders
        via: Folders
      - to: settings.passkeys
        via: Passkeys
      - to: settings.terminal
        via: Terminal
      - to: settings.pc-load
        via: PC load
      - to: settings.remote-power-guard
        via: Hide shut down remotely, when Windows needs administrator rights

  - id: settings.screen-time
    area: settings
    title: Screen time sheet
    root: data-surface
    reach:
      - Settings › Activity › Screen time
    holds:
      - Today, 7 days and 30 days
      - time by section and by feature
      - a note on how time is counted, an idle stretch of more than 15 minutes counts as 15
      - a Send to task-os button
    does:
      - the back arrow returns to Settings

  - id: settings.document
    area: settings
    title: Document sheet
    root: data-surface
    reach:
      - a document in Settings › Documents
    holds:
      - the document rendered
      - Copy Markdown, Open on GitHub and Retry
    states:
      - a read that failed says so and offers Retry

  - id: settings.usage-shows
    area: settings
    title: Usage meter sheet
    root: data-surface
    reach:
      - Settings › Appearance › Usage meter
    holds:
      - a switch each for Claude, Codex and Grok
    does:
      - each switch saves at once and applies on every device
    states:
      - all off hides the Usage card

  - id: settings.launch-defaults
    area: settings
    title: Launch defaults sheet
    root: data-surface
    reach:
      - Settings › Agents › Launch defaults
    holds:
      - Favorite agent, the one that keeps its own launch button on every project row
      - Visible agents, a switch per agent
      - Models in the dropdowns, a switch per catalog model
      - Launch presets, with a model, an effort and (for a model with context tiers) a context for a new one and a kebab on each saved one
      - Per agent, a row that opens that agent's sheet
    links:
      - to: settings.agent
        via: an agent
      - to: settings.preset-menu
        via: preset kebab

  - id: settings.preset-menu
    area: settings
    title: Launch preset menu
    root: data-surface
    reach:
      - the kebab on a saved launch preset
    holds:
      - Remove

  - id: settings.agent
    area: settings
    title: Agent sheet
    root: data-surface
    reach:
      - an agent in Launch defaults
    holds:
      - the agent's model, effort and permission choices, and its verbose and debug switches
      - a note on how that agent signs in
    does:
      - the back arrow returns to Launch defaults

  - id: settings.chief
    area: settings
    title: Chief sheet
    root: data-surface
    reach:
      - Settings › Agents › Chief
      - Chief settings in the chief's row menu
    holds:
      - the chief's model and the worker cap
      - Count only chief-dispatched sessions
      - "Automations, one switch each: Doorbell, Auto-drain queue, Chief job failures, Chief CI failures, Job self-heal, Weekly proposals, Grok Bot and Grok auto-switch"
    does:
      - each switch saves when tapped and needs no restart

  - id: settings.channels
    area: settings
    title: Telegram sheet
    root: data-surface
    reach:
      - Settings › Connections › Telegram
    holds:
      - the bots, with a green dot while one runs
      - "Sessions: the switch that hides Telegram sessions from the Board and the session list"
      - the checks, the profiles, the skills a bot can bind, the setup steps and what to do if the bot does not answer
    states:
      - No bots yet, with the step that adds them
    links:
      - to: settings.channel-bot
        via: a bot

  - id: settings.channel-bot
    area: settings
    title: Bot sheet
    root: data-surface
    reach:
      - a bot in the Telegram sheet
    holds:
      - Restart bot
      - the bot's name, skill and model
      - "Earlier conversations: Relay, Offer a resume when a chat starts and the idle close time"
      - the bot's status
    does:
      - a running bot picks up a new skill or model when it restarts

  - id: settings.context-filter
    area: settings
    title: Context filter sheet
    root: data-surface
    reach:
      - Settings › Connections › Context filter
    holds:
      - the mode, which applies at once to every coding-agent session on this PC
      - the coding agents it covers
      - the savings recorded
    states:
      - No savings recorded yet

  - id: settings.fleet-scope
    area: settings
    title: Fleet scope sheet
    root: data-surface
    reach:
      - Settings › Connections › Fleet scope
    holds:
      - a filter field and one switch per repo
    does:
      - a switch off makes the repo dormant for fleet-wide runs, and applies at once
    states:
      - No repos match the filter, with a Clear filter button

  - id: settings.inspiration
    area: settings
    title: Inspiration sheet
    root: data-surface
    reach:
      - Settings › Connections › Inspiration
    holds:
      - the latest digest
      - What you like, a note or the path of a file that holds it, with a Save note button
      - Newsletters, YouTube channels and X accounts, each with a list, an add form and a kebab per entry
      - X login, with a Log into X button
    states:
      - unavailable, with the reason
    links:
      - to: settings.inspiration-menu
        via: entry kebab

  - id: settings.inspiration-menu
    area: settings
    title: Inspiration entry menu
    root: data-surface
    reach:
      - the kebab on a newsletter, channel or account
    holds:
      - Edit
      - Remove
    links:
      - to: chrome.confirm
        via: Remove

  - id: settings.tokens
    area: settings
    title: API tokens sheet
    root: data-surface
    reach:
      - Settings › Connections › API tokens
    holds:
      - tokens that each run one job from a link, with a label and the job to bind, and a Create token button
      - the new token's value, shown once, with a Copy button
      - the delegate token for an outside agent, with Turn on, Turn off and Regenerate
    states:
      - No tokens yet

  - id: settings.folders
    area: settings
    title: Folders sheet
    root: data-surface
    reach:
      - Settings › This PC › Folders
      - an empty Code or Life tab's Open Settings button
    holds:
      - the Projects, Apps, Life OS and fleet-config folders
      - the hidden projects, one per line
      - the chat file folders, with an Add button and a kebab per folder

  - id: settings.outbox-menu
    area: settings
    title: Chat file folder menu
    root: data-surface
    reach:
      - the kebab on a chat file folder
    holds:
      - Remove

  - id: settings.passkeys
    area: settings
    title: Passkeys sheet
    root: data-surface
    reach:
      - Settings › This PC › Passkeys
    holds:
      - Enroll this device, with the steps to open the enrollment window from the tray menu
      - the enrolled passkeys, each removable
    states:
      - Checking while it reads

  - id: settings.terminal
    area: settings
    title: Terminal sheet
    root: data-surface
    reach:
      - Settings › This PC › Terminal
    holds:
      - Terminal history in lines
      - Large file limit in MB
      - Allow the private network, a switch (off by default) that asks first
      - Also allow screen view without Tailscale, a switch (off by default) that asks first and works only with the one above on

  - id: settings.pc-load
    area: settings
    title: PC load sheet
    root: data-surface
    reach:
      - Settings › This PC › PC load
    holds:
      - Restart at night, a switch with From and Until times
    states:
      - nothing restarts outside the window or while the health reading is unknown
    links:
      - to: settings.pc-load-on
        via: switch on

  - id: settings.pc-load-on
    area: settings
    title: PC load, night restart on
    root:
      none: the same sheet with the switch on and the window shown.
    states:
      - the row in Settings reads Night restart with the window, 21:00 to 06:30 by default

  - id: settings.remote-power-guard
    area: settings
    title: Admin rights needed sheet
    root: data-surface
    reach:
      - the Hide shut down remotely switch, when Windows only lets an administrator change it
    holds:
      - the command to paste into an elevated PowerShell, with a Copy command button
      - how to shut down on purpose from a Remote Desktop session
    does:
      - Done closes

  # ------------------------------------------------------------------- input
  - id: input.swipe-row
    area: input
    title: Skill row swipe
    root:
      none: a gesture on a Life skill row, drawn inside the row.
    reach:
      - swipe a skill row on a touch screen
    holds:
      - a swipe right resumes the newest conversation, a swipe left starts a new one
    does:
      - past the full-swipe line a release commits the action; short of it the row rests open on its pane
    states:
      - Resume is disabled with the reason No conversation yet for a skill with none
    why: the frequent action sits on the leading edge, like a mail app; both are also the kebab's first items

  - id: input.long-press-hint
    area: input
    title: Long-press hint
    root:
      none: a gesture that shows the existing toast.
    reach:
      - hold an icon-only control for half a second on a touch screen
    does:
      - toasts the control's title; the hold never triggers the control
    why: a touch screen has no hover to show a title

  - id: input.screen-gestures
    area: input
    title: Screen control gestures
    root:
      none: gestures on the Screen view's stage.
    reach:
      - touch the stage in Control
    holds:
      - tap clicks, two quick taps double-click, a long press right-clicks, press and drag drags
      - two fingers scroll or pinch to zoom, a two-finger tap right-clicks
      - Trackpad moves a cursor by how far the finger travels
    states:
      - a loupe follows the finger in Touch

  - id: input.hardware-keys
    area: input
    title: Hardware keyboard in Control
    root:
      none: keys typed on a hardware keyboard while the Screen view is open.
    reach:
      - type with a keyboard attached while Control is on
    does:
      - the keys go to the PC; held modifiers clear after the next key

  - id: input.escape
    area: input
    title: Escape and arrow keys
    root:
      none: keyboard paths on menus, pickers and overlays.
    reach:
      - a keyboard on a desktop browser
    does:
      - Escape closes an open row menu, a model picker or the Changed files overlay
      - the arrow keys, Home and End move through a menu or a model picker, and Enter or Space picks
    why: the menus follow the standard menu and listbox keyboard patterns

  - id: input.composer-send
    area: input
    title: Composer send key
    root:
      none: a keyboard path on the composer's text box.
    reach:
      - Ctrl or Command with Enter in a composer that enables it
    does:
      - sends the message instead of adding a new line

