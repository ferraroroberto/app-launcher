# UX surface map: the single source for docs/ux-surface-map.md.
#
# Every screen, drill-in, menu, sheet, dialog, popover, Settings row, state, gesture and key a person can
# reach in app-launcher, one entry per surface. The convention is project-scaffolding's docs/ux-surface-map.md.
# Edit this file, never the generated page; then run `python scripts/ux_surface_map.py`.
#
# A change that adds, removes, renames or reshapes a user-visible surface updates its entry here in the same
# change, adds or removes the matching `data-surface` attribute in the code, and regenerates the page.

app: app-launcher

notes: |
  The checklist of everything a person can see and do in app-launcher: every tab, card, drill-in, menu, sheet, dialog, gesture and key, with how it is reached and what is on it.

  **Keeping it true.** A change that adds, removes, renames or reshapes a user-visible surface updates its entry in this file in the same PR, adds or removes the matching `data-surface` attribute, and regenerates the page with `python scripts/ux_surface_map.py`. `scripts/ux_surface_ratchet.py` holds the markup, the JS and this file together and fails a page that is not what the file generates.

  **Ids.** `<area>.<surface>`, lowercase words joined by `.` or `-`, the same form the e2e `surface(page, "<id>")` hook takes. An id never changes when a title is reworded. The vendored row menu builds its own element, so its call sites stamp the id on what `attach` returns; the vendored sign-in sheet and update banner stamp their own fixed ids.

  ## Ground rules

  **Five tabs, one gear.** The nav is Board · Code · Life · Apps · Jobs. Settings is the gear in every page header and is not a tab. Every tab opens with the same page header: the tab's name, one context line, the CPU reading, the theme toggle and the gear.

  **Layout bands** (the same markup, three placements):

  | Band | Condition | Nav | Session and job detail |
  | --- | --- | --- | --- |
  | Phone | touch pointer | floating bottom pill, hidden while a session view is open | full-screen overlay or sheet |
  | Narrow window | a mouse below 1100px, or a touch device wider than a phone | the tab bar at the top of the 772px column | full-screen overlay or sheet |
  | Wide | 1100px and up with a mouse | an 80px left rail; the Board spans everything right of it | Code and Jobs become list-and-detail: the session view or the job sheet docks beside the list, and an empty pane says so |

  **Where state lives.** Layout choices that belong to one device (theme, text size, folded cards, the last model picked) live in the browser. Everything else (favorites, hidden projects, launch defaults, jobs, usage choices) is saved by the server and applies on every device.

  **Gating.** A feature switched off in Settings or absent on this PC removes its rows rather than greying them: the Telegram row in Sessions needs a running Telegram session, the Voice group shows only in a Remote Desktop session, the Inspiration sheet says why it is unavailable, and a usage provider switched off leaves the Usage card.

  **Sheets.** Every sheet is a native `<dialog>` with a header close (✕) and one full-width primary action.

walk:
  date: 2026-11-18
  build: e6da4359
  widths: [390, 1280]
  themes: [light, dark]

areas:
  - id: chrome
    title: Chrome
    notes: What every tab shares.
  - id: code
    title: Code tab
  - id: terminal
    title: Session view
    notes: The full-screen overlay one session opens into, in Terminal or Chat mode, with the sheets and menus that hang off it.
  - id: screen
    title: Screen view
  - id: board
    title: Board tab
  - id: jobs
    title: Jobs tab
  - id: apps
    title: Apps tab
  - id: lifeos
    title: Life tab
  - id: settings
    title: Settings
  - id: input
    title: Gestures and keys

surfaces:
  # ------------------------------------------------------------------ chrome
  - id: chrome.nav
    area: chrome
    title: Nav
    root: data-surface
    reach:
      - always on screen except while a session view is open on a phone
    holds:
      - one tab per destination in the order Board, Code, Life, Apps, Jobs, each an icon over a label
      - the Board tab carries a badge counting the questions the chief waits on you for, from every tab
    does:
      - switches the pane; the tab you leave keeps its scroll and folded cards
    why: the fleet navigation contract, a floating pill on the phone and a left rail on a wide window
    phone: a floating pill at the bottom edge
    desktop: a left rail from 1100px, the tab bar on top below it
    links:
      - to: board.tab
        via: Board
      - to: code.tab
        via: Code
      - to: lifeos.tab
        via: Life
      - to: apps.tab
        via: Apps
      - to: jobs.tab
        via: Jobs

  - id: chrome.page-head
    area: chrome
    title: Page header
    root:
      none: the header card is repeated at the top of every pane's own markup, so each pane's entry carries it.
    holds:
      - the tab's name and icon
      - one context line that names only the exceptions in their tone colour, in a compact form when the full one does not fit
      - the CPU reading, a muted percentage that turns amber then red, or a dash when no sample was taken
      - the theme toggle
      - the Settings gear
    does:
      - the CPU reading opens the PC load sheet
      - the toggle flips light and dark and remembers it on this device
      - the gear opens Settings
    why: Settings left the nav so five tabs keep readable labels; the CPU reading answers "is the PC loaded" from any tab
    links:
      - to: chrome.cpu-sheet
        via: CPU reading
      - to: settings.pane
        via: gear

  - id: chrome.cpu-sheet
    area: chrome
    title: PC load sheet
    root: data-surface
    reach:
      - the CPU reading in any page header
      - Settings › This PC › PC load is a different sheet and holds only the night restart
    holds:
      - the PC's private IP address
      - total CPU and memory used
      - one row per physical disk the hub measures, labelled by drive letter, with busy percent, queue and read and write latency, amber when the hub says watch and red when it says alert
      - the three busiest groups of processes by name and cores used, an Everything else row so the rows add up, and a Restart action on a flagged process
      - a toast area for the result of a restart or a copy
    does:
      - Copy on the IP row puts the address on the clipboard
      - the Screen button opens the Screen view of the PC
      - Done closes
    states:
      - a dash instead of a number when the server could not take a sample
      - no disk rows when the hub sends none, and Not confirmed on a disk the hub could not judge, never a healthy-looking row
      - Unknown instead of an address, with Copy disabled, when the PC's address could not be read
    links:
      - to: screen.view
        via: Screen
      - to: chrome.confirm
        via: Restart on a flagged process

  - id: chrome.confirm
    area: chrome
    title: Confirm dialog
    root: data-surface
    reach:
      - "a destructive or sensitive action asks through it: removing an app, a job, a passkey or an inspiration entry, stopping a running app or a listener, killing a stuck run, deleting a conversation or a log, restarting a process, a bot or the chief, running a job that requires confirmation, pulling before launching on a repo that is behind, sending a message that is already queued"
      - stopping an ordinary session does not ask; only the chief and a Telegram session do
    holds:
      - a title and message worded for the action
      - an optional text field when the action needs a typed phrase
      - one full-width confirm button
    does:
      - the header close cancels
    why: one dialog for every confirmation so the wording and the buttons never drift

  - id: chrome.toast
    area: chrome
    title: Toast
    root: data-surface
    reach:
      - any action that has a result to report
      - a long-press on an icon-only control shows its title as a toast
    holds:
      - one line of text
    why: it sits on the body, outside the app column, so the floating nav cannot clip it on iOS

  - id: app.update-banner
    area: chrome
    title: New version banner
    root: data-surface
    reach:
      - appears when the server reports a build newer than the one this page booted with
    holds:
      - the text New version available
      - a Reload button
      - a dismiss button
    does:
      - Reload reloads the page; only a tap does it
      - a dismissed banner stays down until the server moves to yet another build

  - id: shared.login
    area: chrome
    title: Sign-in sheet
    root: data-surface
    reach:
      - opens by itself on the first request a device makes without a valid token
    holds:
      - a password field and its one-line error
      - a Sign in button
    states:
      - wrong password, locked out after repeated failures, signed in
    why: the fleet's vendored sign-in; the app only calls it from the HTTP layer

  - id: chrome.build-footer
    area: chrome
    title: Build readout
    root:
      none: the page foot, one line at the end of the column outside every tab panel.
    holds:
      - the running build and when it started

  # -------------------------------------------------------------------- code
  - id: code.tab
    area: code
    title: Code tab
    root: data-surface
    reach:
      - the Code tab, the app's default landing tab
    holds:
      - the page header
      - the Usage card
      - the Sessions card
      - the Projects card
    does:
      - the cards fold; the fold survives reloads on this device
    why: the tab answers three questions in order, can I launch, what is running, what can I start
    desktop: on a wide window the tab is list-and-detail, a session opens in a pane beside the list
    links:
      - to: code.usage
        via: Usage card
      - to: code.sessions
        via: Sessions card
      - to: code.projects
        via: Projects card
      - to: code.detail-empty
        via: wide window with no session open

  - id: code.usage
    area: code
    title: Usage card
    root: data-surface
    reach:
      - the first card of the Code tab
    holds:
      - the card summary naming the pace in its tone
      - one meter per provider that is switched on, with 5 hour and weekly bars and when they reset
      - a footer saying what the context filter saved today
      - a trailing menu button
    does:
      - a tap anywhere on the meters opens the Usage sheet
    states:
      - reading the quota while the first sample is pending
      - the card disappears when every provider is switched off in Settings
    links:
      - to: code.usage-sheet
        via: tap the meters
      - to: code.usage-menu
        via: card menu

  - id: code.usage-menu
    area: code
    title: Usage menu
    root: data-surface
    reach:
      - the kebab on the Usage card
    holds:
      - Usage details
      - History
    links:
      - to: code.usage-sheet
        via: Usage details
      - to: code.history-sheet
        via: History

  - id: code.usage-sheet
    area: code
    title: Usage sheet
    root: data-surface
    reach:
      - tap the Usage meters
      - Usage menu › Usage details
    holds:
      - the per-provider quota windows and spend in full
    does:
      - Done closes

  - id: code.history-sheet
    area: code
    title: History sheet
    root: data-surface
    reach:
      - Usage menu › History
    holds:
      - Day, Week and Month buckets
      - 30 days, 90 days, 6 months and Custom ranges, with From and To day fields for Custom
      - tiles and charts for lines of code, PRs merged, issues and tokens, with an In and Out switch on tokens
      - a per-repo table sortable by added lines, removed lines, PRs, opened and closed
      - the token split by agent and the age of each data source
      - a Refresh button and a toast while it runs
    states:
      - answers at once from the cache however old, then refreshes in place
      - a figure that could not be read says so instead of showing zero

  - id: code.sessions
    area: code
    title: Sessions card
    root: data-surface
    reach:
      - the second card of the Code tab
    holds:
      - one row per running session with the agent's avatar and an alive badge, the title and a line of folder, model, status, age and uptime
      - the chief's row, wearing a crown, with Start and Resume while it is stopped
      - a Telegram summary row that counts the hidden channel sessions
    does:
      - tap a row opens that session's view
      - each row's kebab opens its menu
    states:
      - "empty: No sessions launched from here yet, with a Show projects button"
      - the Telegram row shows only while a Telegram session runs and the hide setting is on
    links:
      - to: terminal.overlay
        via: tap a row
      - to: code.session-menu
        via: row kebab
      - to: code.chief-menu
        via: chief kebab
      - to: code.channel-list
        via: Telegram row
      - to: code.projects
        via: Show projects

  - id: code.session-menu
    area: code
    title: Session row menu
    root: data-surface
    reach:
      - the kebab on a session row
    holds:
      - Terminal and Chat
      - Background tasks and Links
      - Open in new window
      - Copy path
      - Rename
      - Stop, last, behind a divider
    does:
      - Stop asks the agent to quit cleanly, then force-terminates as a fallback, with no confirm for an ordinary session
    states:
      - a Telegram session asks to confirm, and while Telegram sessions are hidden it cannot be stopped from here
    links:
      - to: terminal.overlay
        via: Terminal and Chat
      - to: terminal.bg-tasks-sheet
        via: Background tasks
      - to: terminal.links-sheet
        via: Links
      - to: terminal.rename-dialog
        via: Rename

  - id: code.chief-menu
    area: code
    title: Chief row menu
    root: data-surface
    reach:
      - the kebab on the chief's row
    holds:
      - Restart, only while the chief runs
      - Chief settings
      - the session menu's own items
    does:
      - Restart and Stop ask the confirm dialog, since the chief is the one session a mis-tap should not take down
    links:
      - to: settings.chief
        via: Chief settings
      - to: chrome.confirm
        via: Restart or Stop

  - id: code.channel-list
    area: code
    title: Telegram sessions list
    root: data-surface
    reach:
      - the Telegram summary row in the Sessions card
    holds:
      - a read-only list of the running Telegram channel sessions
    does:
      - Done closes; there is no Stop or delete here by design
    states:
      - "empty: No Telegram sessions are running"
    why: stopping a channel session cuts someone's chat off, so it is never one tap

  - id: code.projects
    area: code
    title: Projects card
    root: data-surface
    reach:
      - the third card of the Code tab
    holds:
      - "the launch toolbar: a model picker with Detached and Resume switches, a Sync all button and a Refresh git button"
      - a filter field and a favorites filter
      - one row per project with a star, the agent launch button, git chips and a kebab
      - a footer with when git was last checked
    does:
      - tap an agent button launches it in the project
      - the star pins a project to the top
      - Sync all fast-forwards every clean project that is only behind
    states:
      - "empty: No projects found, with an Open Settings button"
      - "filter with no match: No projects match the filter, with a Clear filter button"
    links:
      - to: code.model-menu
        via: model picker
      - to: code.project-menu
        via: row kebab
      - to: code.git-sync-sheet
        via: Sync all
      - to: chrome.confirm
        via: launching on a repo that is behind
      - to: settings.folders
        via: Open Settings

  - id: code.model-menu
    area: code
    title: Launch model menu
    root: data-surface
    reach:
      - the model picker on the Projects card's toolbar
    holds:
      - the visible models grouped by agent, and the launch presets
    does:
      - picking one sets the model the next launch uses and closes the menu
    why: the choices are Settings › Launch defaults, so launching never needs Settings
    links:
      - to: code.preset-menu
        via: preset picker
      - to: settings.launch-defaults
        via: models and presets come from here

  - id: code.preset-menu
    area: code
    title: Launch preset menu
    root: data-surface
    reach:
      - the preset picker beside the model picker
    holds:
      - Default and each saved preset, a model with the effort it runs at

  - id: code.project-menu
    area: code
    title: Project row menu
    root: data-surface
    reach:
      - the kebab on a project row
    holds:
      - a Launch row per visible agent that is not the favorite
      - GitHub issues
      - Open in VS Code
      - Show changes
      - Pull, shown only when it would work
      - Open folder
    links:
      - to: code.changes-overlay
        via: Show changes

  - id: code.git-sync-sheet
    area: code
    title: Sync all sheet
    root: data-surface
    reach:
      - the Sync all button on the Projects toolbar
    holds:
      - one line per project saying whether it was fast-forwarded or skipped and why
    does:
      - Done closes
    states:
      - a state line while it runs and when nothing needed pulling

  - id: code.changes-overlay
    area: code
    title: Changed files overlay
    root: data-surface
    reach:
      - Project menu › Show changes
      - Session menu › Changed files
    holds:
      - a bar with the title, Refresh and Close
      - a search field
      - the changed and untracked files with A, M and D badges and added and removed counts
      - each file opens into its diff, with a switch between the diff and the whole file
    states:
      - empty and error states are lines in the body, not a separate screen
    links:
      - to: code.changes-empty
        via: nothing changed
      - to: code.changes-file-menu
        via: file kebab

  - id: code.changes-empty
    area: code
    title: Changed files, nothing to show
    root:
      none: a state line drawn inside the Changed files overlay.
    states:
      - a clean tree says so; a project that is not a git repo says so

  - id: code.changes-file-menu
    area: code
    title: Changed file menu
    root: data-surface
    reach:
      - the kebab on a changed file
    holds:
      - Preview
      - Copy content
      - Copy diff
      - Copy path
      - Open on PC

  - id: code.detail-empty
    area: code
    title: Session detail, empty
    root: data-surface
    reach:
      - a wide window on the Code tab with no session open
    holds:
      - No session open, and A session opens here, beside the list
    desktop: only on a wide window

  # ---------------------------------------------------------------- terminal
  - id: terminal.overlay
    area: terminal
    title: Session view
    root: data-surface
    reach:
      - tap a session row in Code › Sessions
      - the session menu's Terminal and Chat items
      - a session drawer's Open on the Board
      - a link that carries a session id
    holds:
      - a bar with Back, the title, the model chip, the context ring, a Terminal and Chat switch and the actions menu
      - the Chat pane or the terminal, one at a time
      - the composer under either
      - a status strip with the terminal's state and activity
    does:
      - Back closes the view
      - the switch changes mode and remembers it per session
      - a tap on the context ring toasts how full the window is, and the ring hides while the number is unknown
    why: one overlay with two modes so a session never needs two places to answer
    phone: full screen, and the floating nav hides while it is open
    desktop: on a wide window it docks in the pane beside the session list
    links:
      - to: chat.overlay
        via: Chat mode
      - to: terminal.session-menu
        via: actions menu
      - to: terminal.model-sheet
        via: model chip
      - to: terminal.attach-menu
        via: composer attach
      - to: terminal.keys-popover
        via: composer keys

  - id: chat.overlay
    area: terminal
    title: Chat mode
    root: data-surface
    reach:
      - the Chat side of the switch in the session view
      - a session opened with Open a session in Chat on in Settings
    holds:
      - the transcript as a list of your prompts and the agent's replies, with tool calls and thinking folded into one step line per run
      - a Load older button at the top and a Latest pill when scrolled away from the end
      - the live panels for a waiting plan and for the resume picker
      - a note for a detached session that has no terminal
      - a chip counting queued messages, and the composer
    does:
      - tap a file chip opens the file in the HTML viewer or the changes overlay
      - tap an image opens the lightbox
    states:
      - empty, loading and failed transcript are one status line each
      - a detached session says delivery is typed into the PC console and not confirmed
    links:
      - to: chat.question-card
        via: an agent question
      - to: chat.plan-card
        via: a plan for approval
      - to: chat.resume-card
        via: /resume
      - to: chat.pending-sheet
        via: queued chip
      - to: chat.lightbox
        via: tap an image
      - to: chat.html-viewer
        via: tap an HTML file
      - to: readback.summary-modal
        via: Summarize and read
      - to: chrome.confirm
        via: sending a message that is already queued

  - id: terminal.session-menu
    area: terminal
    title: Session actions menu
    root: data-surface
    reach:
      - the actions button in the session view's bar
    holds:
      - Rename and Copy link
      - Changed files, Background tasks and Links where the agent supports them
      - in Chat mode, Hide or Show steps, Hide or Show automatic, Load new and Reload
      - Compact, for a Claude session
      - Read aloud and Summarize and read
      - Stop and kill, last, behind a divider
    does:
      - Compact sends /compact through the same verified route as Send
      - Stop and kill ends the session at once and closes the view, asking the confirm dialog only for the chief and for a Telegram session
    links:
      - to: terminal.rename-dialog
        via: Rename
      - to: code.changes-overlay
        via: Changed files
      - to: terminal.bg-tasks-sheet
        via: Background tasks
      - to: terminal.links-sheet
        via: Links
      - to: readback.summary-modal
        via: Summarize and read
      - to: chrome.confirm
        via: Stop and kill on the chief or a Telegram session

  - id: terminal.rename-dialog
    area: terminal
    title: Rename session
    root: data-surface
    reach:
      - Rename in either session menu
    holds:
      - a name field that says Leave blank for the automatic title
      - a read-only link field with a Copy link button, shown for a session that has a shareable link
    does:
      - Save stores the name and shows it in the list, the Board and the bar

  - id: terminal.model-sheet
    area: terminal
    title: Switch model sheet
    root: data-surface
    reach:
      - the model chip in the session view's bar, shown for an agent that has an in-session switch
    holds:
      - a note saying what a switch does for that agent
      - one row per model the agent offers
    does:
      - a pick types the agent's own /model for this session only and waits for it to report the change
      - Done closes
    states:
      - a switch the server could not confirm leaves the old model showing and says why

  - id: terminal.bg-tasks-sheet
    area: terminal
    title: Background tasks sheet
    root: data-surface
    reach:
      - Background tasks in the session menus
    holds:
      - the tasks a Claude session launched in the background, Running first with elapsed time, then Finished with status
      - each task opens its end-of-output tail
    states:
      - a state line for loading, empty and failed

  - id: terminal.links-sheet
    area: terminal
    title: Links sheet
    root: data-surface
    reach:
      - Links in the session menus
    holds:
      - every artifact and URL the transcript mentioned, in folding groups with a count each
    states:
      - a state line for loading, empty and failed

  - id: terminal.attach-menu
    area: terminal
    title: Attach menu
    root: data-surface
    reach:
      - the attach button in any composer
    holds:
      - Photo
      - Extract text (OCR), hidden when photo-ocr is not configured
      - Attach file (to context)
      - Attach large file (not read)
    does:
      - each opens the device's picker, and the result stages in the composer

  - id: terminal.keys-popover
    area: terminal
    title: On-screen keys
    root: data-surface
    reach:
      - the keys button in the terminal composer
    holds:
      - arrows, Tab, Esc and Ctrl and Alt modifiers
    does:
      - the popover stays open across taps so several keys can be sent in a row
      - Ctrl C delivers exactly one interrupt byte

  - id: chat.question-card
    area: terminal
    title: Agent question card
    root: data-surface
    reach:
      - the agent called AskUserQuestion
    holds:
      - the question with its numbered options and a typed answer field
      - a Submit answers button for a multi-choice or several-question call
    does:
      - tapping an option answers a single-choice question at once
      - the card locks until the agent's answer lands in the transcript, then shows what was picked
    states:
      - an older question is plain history with nothing to tap, as is every card in the Life conversation viewer

  - id: chat.plan-card
    area: terminal
    title: Plan card
    root: data-surface
    reach:
      - the agent called ExitPlanMode
    holds:
      - the plan rendered as markdown
      - "how it was answered: Approved, Sent back with feedback, Not approved or Never shown"
    links:
      - to: chat.plan-panel
        via: a plan waiting for you

  - id: chat.plan-panel
    area: terminal
    title: Waiting plan panel
    root: data-surface
    reach:
      - a full-control session whose terminal shows the plan picker
    holds:
      - the picker's options exactly as the terminal lists them, with the plan itself when the transcript does not show it yet
      - a field to say what should change and a Send back button
    does:
      - a Yes option approves
      - it re-reads the screen before typing and sends nothing if the option number no longer carries the label you tapped
    states:
      - a detached session says to answer in the PC console

  - id: chat.resume-card
    area: terminal
    title: Resume a session card
    root: data-surface
    reach:
      - the terminal shows the agent's own /resume picker
      - typing /resume in the Chat composer, which then sends nothing to the terminal
    holds:
      - a search field and the project's earlier sessions as a list
      - a close button
    states:
      - Loading, No sessions to resume in this project yet, and No session matches the search

  - id: chat.pending-sheet
    area: terminal
    title: Queued messages sheet
    root: data-surface
    reach:
      - the queued chip above the Chat composer
    holds:
      - the messages waiting for the agent, in order
    does:
      - Done closes

  - id: chat.lightbox
    area: terminal
    title: Image lightbox
    root: data-surface
    reach:
      - tap an image in the transcript or in a composer's staged attachment
    holds:
      - the image and a close button

  - id: chat.html-viewer
    area: terminal
    title: HTML viewer
    root: data-surface
    reach:
      - tap an HTML or Markdown file chip in Chat or a Life document
    holds:
      - the file's name and the file rendered without scripts
      - a Download button
    does:
      - the phone's back gesture closes the viewer instead of leaving the app
    states:
      - a note says it is shown without scripts

  - id: readback.summary-modal
    area: terminal
    title: Reply summary
    root: data-surface
    reach:
      - Summarize and read in the session menu
    holds:
      - the summary text and a close button
      - a footer saying it is reading aloud
    does:
      - a tap anywhere dismisses it
    states:
      - the menu item appears once the hub answers its health probe

  # ------------------------------------------------------------------ screen
  - id: screen.view
    area: screen
    title: Screen view
    root: data-surface
    reach:
      - the Screen button in the PC load sheet
    holds:
      - a bar with the title, a display picker when the PC has several screens, and Close
      - a View and Control switch, and in Control a Touch and Trackpad switch
      - a keyboard button and a quality button
      - the PC's screen as a live image with a cursor, a loupe and a state line
      - a handle that folds the bar away
    does:
      - View only looks; Control sends taps, drags and keys to the PC
    states:
      - connecting and failed each draw as a line over the stage
    links:
      - to: screen.keys
        via: keyboard
      - to: screen.quality-sheet
        via: quality
      - to: screen.paste-sheet
        via: Paste to PC
      - to: input.screen-gestures
        via: touch in Control

  - id: screen.keys
    area: screen
    title: Screen keys
    root: data-surface
    reach:
      - the keyboard button in Control
    holds:
      - a main page with Esc, Tab, Ctrl, Alt, Shift, Win, Del, the arrows, Backspace, Enter, Task Mgr, Paste to PC and Paste plus Ctrl+V
      - a second page with F1 to F12, Home, End, PgUp and PgDn
      - a field that takes what the phone's keyboard types
    does:
      - a modifier stays held until the next key and shows that it is held

  - id: screen.paste-sheet
    area: screen
    title: Paste to PC sheet
    root: data-surface
    reach:
      - Paste to PC when the phone does not let the page read its clipboard
    holds:
      - a text area and a Send to PC button
    states:
      - a note explains why the paste is manual

  - id: screen.quality-sheet
    area: screen
    title: Quality sheet
    root: data-surface
    reach:
      - the quality button in the Screen view
    holds:
      - a preset switch with a note about the selected preset
      - a Readout switch
    does:
      - Done closes
    links:
      - to: screen.readout
        via: Readout on

  - id: screen.readout
    area: screen
    title: Readout
    root: data-surface
    reach:
      - the Readout switch in the quality sheet
    holds:
      - frames a second, data a second, the average frame size and the round-trip time of a frame
    states:
      - hidden when the switch is off

  # ------------------------------------------------------------------- board
  - id: board.tab
    area: board
    title: Board tab
    root: data-surface
    reach:
      - the Board tab
    holds:
      - the page header
      - a project filter, a refresh button and a collapse-all button
      - a status line and a fetch state line
      - the cards Backlog, Since you last looked, Chief's plan, Claude's turn, Ideas, Your turn, PRs and jobs and Done today
    does:
      - the cards are computed from GitHub, the sessions and the jobs; nothing is dragged
      - Refresh asks GitHub again
    why: one screen answering what needs me now, across everything
    desktop: on a wide window the Board spans everything to the right of the rail
    links:
      - to: board.backlog
        via: Backlog
      - to: board.journal
        via: Since you last looked
      - to: board.chief-plan
        via: Chief's plan
      - to: board.claude-turn
        via: Claude's turn
      - to: board.ideas
        via: Ideas
      - to: board.your-turn
        via: Your turn
      - to: board.prs-jobs
        via: PRs and jobs
      - to: board.done
        via: Done today
      - to: board.repo-list
        via: project filter

  - id: board.repo-list
    area: board
    title: Project filter suggestions
    root: data-surface
    reach:
      - typing in the Board's project filter
    holds:
      - the repos that match, as options
    does:
      - picking one filters every card to that repo; the clear button removes it

  - id: board.backlog
    area: board
    title: Backlog card
    root: data-surface
    reach:
      - the Backlog card on the Board
    holds:
      - a Start with picker that sets the model the rows launch with
      - open issues across every repo of the owner, thin rows of repo, number, title and age
      - buckets that group the issues
    does:
      - Start launches the issue in its repo
      - tap a row opens the issue on GitHub
    states:
      - a row whose issue is already in progress says so and cannot be started again
      - empty and fetch-failed states are lines in the card
    links:
      - to: board.model-menu
        via: Start with
      - to: board.issue-menu
        via: row kebab

  - id: board.model-menu
    area: board
    title: Start with menu
    root: data-surface
    reach:
      - the Start with picker on the Backlog card
    holds:
      - the visible models grouped by agent

  - id: board.issue-menu
    area: board
    title: Issue row menu
    root: data-surface
    reach:
      - the kebab on a Backlog row
    holds:
      - YOLO (start and ship)
      - Open on GitHub
      - Copy link
      - Open in Jobs, on a job's own row

  - id: board.journal
    area: board
    title: Since you last looked
    root: data-surface
    reach:
      - the card appears when something happened since the Board was last looked at
    holds:
      - a short journal of what changed

  - id: board.chief-plan
    area: board
    title: Chief's plan card
    root: data-surface
    reach:
      - the Chief's plan card on the Board
    holds:
      - a notice when the chief is not running and how old the plan is
      - the plan as Questions, Lanes, Queued, In progress and Parked groups of issue rows, each foldable
      - the questions the chief waits on you for, counted in the Board header and the nav badge
    does:
      - tap a row's note glyph opens its plan note
      - tap a question opens the answer sheet
    states:
      - a plan with nothing waiting folds to one line
    links:
      - to: board.plan-note-sheet
        via: a row's note
      - to: board.answer-sheet
        via: a question

  - id: board.plan-note-sheet
    area: board
    title: Plan note sheet
    root: data-surface
    reach:
      - the note glyph on a plan row
    holds:
      - the row's note in full
      - an Open on GitHub button

  - id: board.answer-sheet
    area: board
    title: Chief answer sheet
    root: data-surface
    reach:
      - tap a question in Chief's plan or in Your turn
    holds:
      - each question with its options and an Anything else field
      - an attach button that puts a file or image into the answer
    does:
      - Done closes; an answer is sent when it is complete
    states:
      - an answer in flight locks the card

  - id: board.claude-turn
    area: board
    title: Claude's turn card
    root: data-surface
    reach:
      - the Claude's turn card on the Board
    holds:
      - the live sessions that are working or idle, including the chief, as session rows
    does:
      - tap a row opens its drawer
    states:
      - "empty: a line saying nothing is running"
    links:
      - to: board.drawer
        via: tap a session

  - id: board.ideas
    area: board
    title: Ideas card
    root: data-surface
    reach:
      - the card appears when there are ideas to triage
    holds:
      - a New, Applied and Filtered switch
      - the ideas in the chosen state
    does:
      - tap an idea opens its sheet
    links:
      - to: board.idea-sheet
        via: tap an idea

  - id: board.idea-sheet
    area: board
    title: Idea sheet
    root: data-surface
    reach:
      - tap an idea in the Ideas card
    holds:
      - the idea's text
      - an attach button
      - File it, Drop it and Later
    does:
      - File it opens an issue for the chief to triage
      - Drop it discards the idea; Later keeps it

  - id: board.your-turn
    area: board
    title: Your turn card
    root: data-surface
    reach:
      - the Your turn card on the Board
    holds:
      - sessions that are stalled or waiting on a decision or input
      - the owner checks waiting on you
    does:
      - tap a session opens its drawer
      - an owner check folds open to say what it needs
      - each owner group has a button that opens its answer sheet
    states:
      - "empty: a line saying nothing needs you"
    why: the owner checks are grouped as Before start, Validate to close and Try what shipped
    links:
      - to: board.drawer
        via: tap a session
      - to: board.answer-sheet
        via: an owner group's answer button

  - id: board.prs-jobs
    area: board
    title: PRs and jobs card
    root: data-surface
    reach:
      - the PRs and jobs card on the Board
    holds:
      - open PRs, then today's failed, unconfirmed and stuck job runs, then red CI
    does:
      - tap a PR opens it on GitHub; tap a job run opens that job in Jobs
    links:
      - to: jobs.job-sheet
        via: a job run

  - id: board.done
    area: board
    title: Done today card
    root: data-surface
    reach:
      - the Done today card on the Board
    holds:
      - issues closed since local midnight, latest first, each with a PR link and its proof
      - a Show earlier button that reads one more local day per tap, up to seven
    states:
      - "empty: a line saying nothing is closed yet"

  - id: board.drawer
    area: board
    title: Session drawer
    root: data-surface
    reach:
      - tap a live session on the Board
    holds:
      - the last exchange of the session
      - the same composer as the session view, without the keys
      - Chat and Terminal buttons and a kebab
    does:
      - Reply sends through the composer
      - Chat and Terminal open the session view in that mode; a button is disabled with its reason when the session cannot show it
      - the drawer opens inline under its row and survives the Board's refresh
    links:
      - to: board.drawer-menu
        via: kebab
      - to: terminal.overlay
        via: Chat or Terminal

  - id: board.drawer-menu
    area: board
    title: Drawer menu
    root: data-surface
    reach:
      - the kebab in a session drawer
    holds:
      - Rename
      - Stop
    links:
      - to: chrome.confirm
        via: Stop

  # -------------------------------------------------------------------- jobs
  - id: jobs.tab
    area: jobs
    title: Jobs tab
    root: data-surface
    reach:
      - the Jobs tab
    holds:
      - the page header
      - the Next up card
      - the Jobs card
    does:
      - jobs run from the phone, the Stream Deck or Task Scheduler through one executor with one run history
    desktop: list-and-detail, a job's sheet docks beside the list and an empty pane shows This week
    links:
      - to: jobs.next-up
        via: Next up
      - to: jobs.list
        via: Jobs
      - to: jobs.week-pane
        via: wide window with no job open

  - id: jobs.next-up
    area: jobs
    title: Next up card
    root: data-surface
    reach:
      - the first card of the Jobs tab
    holds:
      - the next three distinct jobs, each with the time, the name and a note of when it fires again
      - a header button
    does:
      - a row opens that job's sheet
      - the header opens the 7-day Schedule sheet
    states:
      - loading, and an empty line when nothing is scheduled
    links:
      - to: jobs.job-sheet
        via: a row
      - to: jobs.agenda-sheet
        via: header

  - id: jobs.agenda-sheet
    area: jobs
    title: Schedule sheet
    root: data-surface
    reach:
      - the Next up card's header
    holds:
      - the next seven days of fires, grouped by day
    does:
      - a fire opens its job's sheet
      - Done closes
    links:
      - to: jobs.job-sheet
        via: a fire

  - id: jobs.week-pane
    area: jobs
    title: This week pane
    root: data-surface
    reach:
      - a wide window on the Jobs tab with no job open
    holds:
      - the Schedule sheet's day-grouped fires
    desktop: only on a wide window

  - id: jobs.list
    area: jobs
    title: Jobs card
    root: data-surface
    reach:
      - the second card of the Jobs tab
    holds:
      - a search field that searches names and run output
      - a Sort and filter button and an Add job button
      - one row per job with an avatar for its kind that wears an alive badge while it runs, the name, one meta line and a kebab
    does:
      - a row opens its sheet
      - Add opens the job dialog
    states:
      - "loading: Loading jobs"
      - "empty: No jobs registered yet, with an Add job button"
      - "search with no match: No jobs or run output match the search, with a Clear search button"
      - a stuck run wears a chip, and a schedule that is not firing says so
    links:
      - to: jobs.job-sheet
        via: tap a row
      - to: jobs.job-menu
        via: row kebab
      - to: jobs.sort-sheet
        via: Sort and filter
      - to: jobs.job-dialog
        via: Add job

  - id: jobs.sort-sheet
    area: jobs
    title: Sort and filter sheet
    root: data-surface
    reach:
      - the sort button in the Jobs card
    holds:
      - "a Sort switch: Next run and A to Z"
    does:
      - Clear resets the sort
      - Done closes

  - id: jobs.job-menu
    area: jobs
    title: Job row menu
    root: data-surface
    reach:
      - the kebab on a job row
    holds:
      - Run now, disabled while a run is live
      - Dry-run check, which resolves the job without running it
      - Edit
      - Remove, last
    links:
      - to: jobs.confirm-run
        via: Run now on a job that needs confirmation
      - to: jobs.job-dialog
        via: Edit
      - to: chrome.confirm
        via: Remove

  - id: jobs.confirm-run
    area: jobs
    title: Confirm a job run
    root:
      none: the shared confirm dialog, worded to name the job and its next step.
    reach:
      - Run now on a job saved with Require confirmation before running
    states:
      - a plain job runs at once with no dialog

  - id: jobs.job-sheet
    area: jobs
    title: Job sheet
    root: data-surface
    reach:
      - tap a job row, a Next up row, a Schedule fire or a Board job run
    holds:
      - the job's details and flags
      - Kill stuck run, when a live run is stuck
      - recent runs, each with its output, that can be pinned and re-run
      - a Run now button
    does:
      - Run now runs the job, or opens the run dialog when it takes parameters
    desktop: docks beside the list instead of covering it
    links:
      - to: chrome.confirm
        via: Kill stuck run
      - to: jobs.run-dialog
        via: Run now with parameters
      - to: jobs.confirm-run
        via: Run now on a confirm job

  - id: jobs.run-dialog
    area: jobs
    title: Run job dialog
    root: data-surface
    reach:
      - Run now on a job with parameters
    holds:
      - one field per parameter
      - Dry run and Run buttons
    does:
      - Dry run resolves the job with these values without running it

  - id: jobs.job-dialog
    area: jobs
    title: Add or edit job
    root: data-surface
    reach:
      - Add job
      - Edit in the job menu
    holds:
      - a name and a kind, script, inline or HTTP, with the fields of that kind
      - arguments and a schedule type with the fields that type needs
      - a cooldown, a mutex group, Alert to Telegram if failed and Require confirmation before running
      - chains to run on success and on failure
      - optional parameters with an Add parameter button
      - a webhook provider with a secret, events and mappings
      - Add and verify, or Save anyway after a pre-flight warning
    states:
      - a missing script blocks the save; a .py with no .venv warns and offers Save anyway
    why: saving runs a pre-flight so a job that cannot run never reaches the schedule

  # -------------------------------------------------------------------- apps
  - id: apps.tab
    area: apps
    title: Apps tab
    root: data-surface
    reach:
      - the Apps tab
    holds:
      - the page header
      - the cards Running, Other ports, Apps, Trays, Mini apps and Performance
    desktop: two columns that scroll on their own, what you can start on the left and Running with Other ports inline on the right
    links:
      - to: apps.running
        via: Running
      - to: apps.other-ports
        via: Other ports
      - to: apps.apps
        via: Apps
      - to: apps.trays
        via: Trays
      - to: apps.mini-apps
        via: Mini apps
      - to: apps.perf
        via: Performance

  - id: apps.running
    area: apps
    title: Running card
    root: data-surface
    reach:
      - the first card of the Apps tab
    holds:
      - one row per app launched from here with its kind avatar, an alive badge and a line like up 2h and its port
      - the Other ports row
    does:
      - a row opens the app over Tailscale
    states:
      - loading and failed lines
      - "empty: Nothing launched from here is running, with a Show apps button"
      - a row is greyed out with the reason when the Tailscale host is not set
    desktop: Open, Copy URL and Stop are visible buttons on each row
    links:
      - to: apps.running-menu
        via: row kebab
      - to: apps.other-ports-sheet
        via: Other ports row

  - id: apps.running-menu
    area: apps
    title: Running app menu
    root: data-surface
    reach:
      - the kebab on a running app
    holds:
      - the pid as a header line
      - Copy URL
      - Stop, last
    links:
      - to: chrome.confirm
        via: Stop

  - id: apps.other-ports
    area: apps
    title: Other ports card
    root: data-surface
    reach:
      - the Other ports card, shown inline on a wide window
    holds:
      - the same rows as the sheet
    desktop: only on a wide window; the phone opens the sheet from the Running card

  - id: apps.other-ports-sheet
    area: apps
    title: Other ports sheet
    root: data-surface
    reach:
      - the Other ports row in the Running card
    holds:
      - every listener on the PC's common app ports, helper services folded under their parent
      - a Check again button
    states:
      - loading and failed lines
      - "empty: Nothing running on common app ports"
    links:
      - to: apps.listener-menu
        via: row kebab

  - id: apps.listener-menu
    area: apps
    title: Listener menu
    root: data-surface
    reach:
      - the kebab on a listener
    holds:
      - Open
      - Copy URL
      - Stop process, which asks for confirmation
    links:
      - to: chrome.confirm
        via: Stop process

  - id: apps.apps
    area: apps
    title: Apps card
    root: data-surface
    reach:
      - the Apps card of the Apps tab
    holds:
      - a filter field
      - one row per registered app, Streamlit, web or tunnel, with its kind avatar and a kebab
      - a Scan for new apps row
    does:
      - a row launches the app
    states:
      - loading and failed lines
      - "empty: No apps registered yet, with a Scan for apps button"
      - "filter with no match: No apps match the filter, with a Clear filter button"
    links:
      - to: apps.app-menu
        via: row kebab
      - to: apps.scan-sheet
        via: Scan for new apps

  - id: apps.app-menu
    area: apps
    title: App row menu
    root: data-surface
    reach:
      - the kebab on an app or tray row
    holds:
      - the kind as a header line
      - Launch visible, or launch hidden with no window
      - Autostart at boot
      - Open link and Copy URL, for a tunnel
      - Rename
      - Copy path
      - Remove, last
    links:
      - to: apps.rename-dialog
        via: Rename
      - to: chrome.confirm
        via: Remove

  - id: apps.rename-dialog
    area: apps
    title: Rename app
    root: data-surface
    reach:
      - Rename in the app menu
    holds:
      - a name field and a Save button

  - id: apps.scan-sheet
    area: apps
    title: New entries sheet
    root: data-surface
    reach:
      - Scan for new apps in the Apps card
      - the empty-state scan buttons of Trays and Mini apps
    holds:
      - the apps, trays and mini apps the scan found that are not registered yet, each selectable
      - an Add selected button
    states:
      - the scan finding nothing says so

  - id: apps.trays
    area: apps
    title: Trays card
    root: data-surface
    reach:
      - the Trays card of the Apps tab
    holds:
      - one row per sister tray found
    states:
      - loading and failed lines
      - "empty: No sister trays found yet, with a Scan for trays button"
    links:
      - to: apps.app-menu
        via: row kebab
      - to: apps.scan-sheet
        via: Scan for trays

  - id: apps.mini-apps
    area: apps
    title: Mini apps card
    root: data-surface
    reach:
      - the Mini apps card, shown only when the scan folder has mini apps or after a scan
    holds:
      - one row per mini app
    states:
      - "empty: No mini apps found yet, with a Scan for mini apps button"
    links:
      - to: apps.scan-sheet
        via: Scan for mini apps

  - id: apps.perf
    area: apps
    title: Performance card
    root: data-surface
    reach:
      - the last card of the Apps tab, folded by default
    holds:
      - the launcher's own timing readings drawn as a chart
    states:
      - loading and failed lines

  # ------------------------------------------------------------------ life os
  - id: lifeos.tab
    area: lifeos
    title: Life tab
    root: data-surface
    reach:
      - the Life tab
    holds:
      - the page header
      - the Skills card with its launch toolbar
      - the Conversations group, with Archived and System folds
      - the Weekly recap card
    links:
      - to: lifeos.skills
        via: Skills
      - to: lifeos.conversations
        via: Conversations
      - to: lifeos.recap
        via: Weekly recap

  - id: lifeos.skills
    area: lifeos
    title: Skills card
    root: data-surface
    reach:
      - the Skills card of the Life tab
    holds:
      - a launch toolbar with a model picker, whose menu holds the Detached and Resume switches
      - a search field for skills and conversations, a clear button and a scope chip for the conversations
      - one row per skill in the life-os checkout with its avatar, a note for a Telegram binding or a restart that is due, when it was last used and a kebab
    does:
      - a row opens that skill's conversations
    states:
      - loading and failed lines
      - "empty: No life-os skills found, with an Open Settings button"
      - "search with no match: No skills match the filter, with a Clear filter button"
