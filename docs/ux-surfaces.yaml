      - to: settings.folders
        via: Open Settings

  - id: lifeos.model-menu
    area: lifeos
    title: Skill launch model menu
    root: data-surface
    reach:
      - the model picker on the Skills toolbar
    holds:
      - the visible models grouped by agent
      - the Detached and Resume switches, under the list
      - a hint that the model is for new conversations and a resumed one keeps its own
    does:
      - the picker's label names any switch that is on

  - id: lifeos.skill-menu
    area: lifeos
    title: Skill row menu
    root: data-surface
    reach:
      - the kebab on a skill row
    holds:
      - Resume last conversation, with its reason as the header when there is none
      - Start new conversation
      - Pick a session, which opens Claude's own session picker for the skill
      - Pin to top or Unpin
