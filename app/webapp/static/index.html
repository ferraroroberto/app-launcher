  <!-- Pre-paint boot (#1134): the vendored text-size boot, which stamps both
       html[data-theme] and html[data-textsize] from app-launcher.theme /
       app-launcher.textsize before any stylesheet, so nothing flashes. -->
  <script>
    (function () {
      var app = 'app-launcher';
      var root = document.documentElement;
      var theme = null;
      var size = null;
      try {
        theme = localStorage.getItem(app + '.theme');
        size = localStorage.getItem(app + '.textsize');
      } catch (e) {}
      var dark = theme ? theme === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.textsize = size === 'small' || size === 'large' ? size : 'default';
    })();
  </script>
  <!-- Pre-paint usage choice (#1657): the last "Usage shows" value this device
       saw, stamped on <html> so the Usage card's static placeholder draws the
       settled row set from the first paint. usage-meter.js keeps it current. -->
  <script>
    (function () {
      // A space-separated provider list; an older device stored one word.
      var shows = 'claude codex';
      var legacy = { claude: 'claude', codex: 'codex', both: 'claude codex', none: '' };
      try {
        var stored = localStorage.getItem('app-launcher.usageshows');
        if (stored !== null) shows = legacy.hasOwnProperty(stored) ? legacy[stored] : stored;
      } catch (e) {}
      document.documentElement.dataset.usageShows = shows;
    })();
  </script>
