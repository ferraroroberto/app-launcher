    <dialog id="scanDialog" class="detail-dialog" data-track-view="sheet.apps-scan">
      <div class="detail-card">
        <div class="detail-header">
          <h2><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg> New entries</h2>
          <button data-track="apps-scan.close" type="button" id="scanCancel" class="icon-button detail-close" aria-label="Close">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"></use></svg>
          </button>
        </div>
        <div id="scanResults" class="scan-results"></div>
        <div class="detail-actions">
          <button data-track="apps-scan.add-selected" id="scanSave" type="button" class="button-primary detail-save-btn">Add selected</button>
        </div>
      </div>
    </dialog>
