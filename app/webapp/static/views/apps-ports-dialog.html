    <!-- Other ports (#1437): every port listener on this PC, helper services
         folded under their parent app (#224/#480), each row's kebab holding
         Open, Copy URL and Stop process. Opened from the Running card's last
         row; Check again is its one primary action. apps-listeners.js. -->
    <dialog id="otherPortsSheet" class="detail-dialog" aria-labelledby="otherPortsSheetTitle">
      <div class="detail-card">
        <div class="detail-header">
          <h2 id="otherPortsSheetTitle"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plug"></use></svg> Other ports</h2>
          <button type="button" id="otherPortsSheetClose" class="icon-button detail-close" aria-label="Close">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"></use></svg>
          </button>
        </div>
        <!-- Moves into the Apps tab's Other ports card on the wide layout
             (#1505); apps.js puts it back here below that query. -->
        <div id="listenersBody" class="listeners-body">
        <div id="listenersState" class="empty-state" role="status" hidden></div>
        <ul id="listenersList" class="card-list action-rows" aria-label="Port listeners"></ul>
        <div id="listenersEmpty" class="empty-state" hidden>
          <svg class="icon empty-state-icon" aria-hidden="true" focusable="false"><use href="#i-plug"></use></svg>
          <p class="empty-state-message">Nothing running on common app ports.</p>
        </div>
        <p class="group-footer listeners-footer">The launcher itself isn't listed.</p>
        </div>
        <div class="detail-actions">
          <button type="button" id="listenersCheckAgain" class="button-primary detail-save-btn">Check again</button>
        </div>
      </div>
    </dialog>
