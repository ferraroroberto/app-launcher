<!-- Markup skeleton — copy into the app's Settings. The control is a vendored
     segmented group (link segmented.css); text-size.js's bindTextSize(group,
     app) marks the stored step (aria-pressed) and handles the clicks. Keep the
     three data-textsize values exactly; the labels may be translated. The
     aria-pressed values below are the pre-bind state: the binder sets them. -->
<div class="segmented" id="textSizeControl" role="group" aria-label="Text size">
  <button type="button" class="segmented-item" aria-pressed="false" data-textsize="small">Small</button>
  <button type="button" class="segmented-item" aria-pressed="true" data-textsize="default">Default</button>
  <button type="button" class="segmented-item" aria-pressed="false" data-textsize="large">Large</button>
</div>
<script type="module">
  import { bindTextSize } from '/static/_vendored/text-size/text-size.js';
  bindTextSize(document.getElementById('textSizeControl'), 'my-app');
</script>
