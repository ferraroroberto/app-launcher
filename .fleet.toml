# ---------------------------------------------------------------------------
# [verify] -- the launch recipe the generated verify-app-launcher skill reads
# (project-scaffolding docs/verify-skill.md). `boot` is the session fixture the
# e2e suite boots a disposable webapp + session-host from; ready_path and
# data_dir_env are the generator defaults (/healthz, APP_LAUNCHER_DATA_DIR).
[verify]
boot           = "tests/e2e/conftest.py::_autoboot_server"
live_optin_env = "LAUNCHER_E2E_LIVE"

# ---------------------------------------------------------------------------
# [comment_ratchet] -- the scaffold's no-history-comments ratchet (#1751,
# project-scaffolding#411). scripts/verify-before-ship.ps1 runs
# scripts/comment_ratchet.py, which fails when a file's count of `#NNN` issue
# references inside comments rises above .comment-ratchet-baseline.json.
# Procedure + limits: project-scaffolding docs/comment-ratchet.md. Vendored
# destinations above are excluded by the script itself; tests are built in.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# ---------------------------------------------------------------------------
# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis
# (project-scaffolding#410). scripts/verify-before-ship.ps1 runs
# scripts/static_ratchet.py, which fails on a duplicate block (jscpd via npx,
# Python and JS), an unused import/variable (ruff F401,F841) or a likely bug or
# security pattern (the ruff B and S families, S113 strict) that is not in
# .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a
# detector that cannot run exits 3, which fails the gate. Vendored copies are
# duplicates by design, so they are excluded. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# ---------------------------------------------------------------------------
# [docs_ratchet] -- the scaffold's README-size and history-marker ratchet
# (project-scaffolding#420). scripts/verify-before-ship.ps1 runs
# scripts/docs_ratchet.py, which fails when README.md passes 40 KiB or its
# baselined size, or when README.md / docs/**/*.md gains an issue reference, a
# dated heading or a changelog heading beyond .docs-ratchet-baseline.json.
# docs/ holds no generated or dated report folders, so nothing is excluded.
# Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# ---------------------------------------------------------------------------
# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage.
# scripts/verify-before-ship.ps1 runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, when a `src` file imports `app`, and when the
# root folders do not match `shape` plus `extra_roots`. Existing offenders are
# baselined at today's size, never excluded; vendored destinations are skipped by
# the script itself. Exit 3 (git unusable, an unparseable file, an unknown shape)
# fails the gate. Where code goes: docs/layout.md; procedure and limits:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# ---------------------------------------------------------------------------
# [instruction_ratchet] -- the scaffold's baseline-and-ratchet lint of the
# fleet's prompt-audit rules over this repo's instruction files (CLAUDE.md,
# AGENTS.md and every SKILL.md plus the docs a skill links to).
# scripts/verify-before-ship.ps1 runs scripts/instruction_ratchet.py, which fails
# when a file's count of hits for a rule rises above
# .instruction-ratchet-baseline.json or a file passes its size cap. Existing
# hits are baselined at today's count, never excluded. Exit 3 (git unusable, a
# file that is not UTF-8, a fence that never closes, an unreadable skill
# description) fails the gate. Procedure and limits: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# ---------------------------------------------------------------------------
# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet check that
# README.md, CLAUDE.md and docs/**/*.md name only repo paths, `python -m`
# modules, relative links and loopback ports that exist.
# scripts/verify-before-ship.ps1 runs scripts/doc_refs_ratchet.py, which fails on
# a dangling reference that .doc-refs-ratchet-baseline.json does not record.
# Exit 3 (git unusable, a file that is not UTF-8, a fence or comment that never
# closes) fails the gate. allow_refs lists the other services' ports the docs
# name on purpose. Procedure and limits: project-scaffolding
# docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = [
  # Other services' loopback ports the docs name on purpose: the hub, the
  # sibling voice-transcriber and photo-ocr apps, the session-host this repo
  # spawns, task-os, and the Chrome DevTools port the iPhone debugging doc uses.
  ":8000", ":8443", ":8444", ":8446", ":8448", ":9221",
  # `:12` is the example line reference in a file chip's description, not a port.
  ":12",
  # Another repo's files, named as pointers (fleet-config's chief skill, life-os's
  # Claude settings).
  ".claude/skills/chief/SKILL.md", ".claude/settings.json",
]

# ---------------------------------------------------------------------------
# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet check that no new
# Python function, class or method appears that nothing in the repo refers to.
# scripts/verify-before-ship.ps1 runs scripts/dead_code_ratchet.py, which fails on
# a definition that .dead-code-ratchet-baseline.json does not record. Exit 3
# (git unusable, a tracked .py file that cannot be read or parsed) fails the
# gate. Files under [vendored] are read for references, never reported.
# entry_decorators and allow name the framework hooks this repo relies on.
# Procedure and limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled          = true
baseline         = ".dead-code-ratchet-baseline.json"
entry_decorators = []
# pytest calls `toterminal` on a report's longrepr by duck typing, never by name.
allow            = ["tests/_credential_hygiene.py:_RedactedRepr.toterminal"]

# ---------------------------------------------------------------------------
# [test_weight] -- test-to-code ratchet. scripts/verify-before-ship.ps1
# runs scripts/suite_weight_ratchet.py, which fails when the ratio of code
# lines under tests/ to code lines under src/ + app/ rises above this ceiling.
# Shrink-only: `python -m scripts.suite_weight_ratchet --update` lowers it after
# a trim; `--raise-ceiling` is the one way up, and a raise says in its PR what
# the extra test weight is for.
# The ceiling includes the import header every feature module repeats: the same
# tests weigh a few hundred lines more as small modules than as one giant file.
# ---------------------------------------------------------------------------
# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage for fleet
# conventions held as stdlib `ast` rules (project-scaffolding#456).
# scripts/verify-before-ship.ps1 runs scripts/conventions_ratchet.py, which fails
# when a file's count for an enabled rule rises above
# .conventions-ratchet-baseline.json. Enabled: no-window (the launcher spawns on
# Windows), logging-not-print and no-drive-path (src/ and app/ are library code),
# git-wrapper (src/git_utils.py is the one run_git). Skipped: secret-compare, since
# hmac.compare_digest is called from six modules and no single helper owns it.
# Exit 3 (git unusable, a .py file that does not parse) fails the gate. Procedure
# and limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled      = true
baseline     = ".conventions-ratchet-baseline.json"
rules        = ["no-window", "logging-not-print", "no-drive-path", "git-wrapper"]
git_wrappers = ["src/git_utils.py"]

[test_weight]
ratio_ceiling = "1.1413"

# ---------------------------------------------------------------------------
# [shot_baseline] -- the scaffold's screenshot baseline. The last stage of
# scripts/verify-before-ship.ps1 runs scripts/shot_baseline.py, which compares
# the PNGs tests/e2e/screens/test_screen_shots.py recaptures (five tabs at phone and
# desktop, light and dark; fictional fixture data, Chromium only) with the ones
# committed under `shots_dir`, fails on a visible change and restores the tree.
# `capture` is the argv after the interpreter. Contract and re-baseline steps:
# project-scaffolding docs/playwright-ui-testing.md ("Screenshot baseline").
[shot_baseline]
enabled   = true
shots_dir = "tests/e2e/shots"
capture   = ["-m", "pytest", "tests/e2e/screens/test_screen_shots.py", "-q", "-p", "no:cacheprovider"]

# ---------------------------------------------------------------------------
# [e2e] -- diff-proportionate routing for scripts/verify-before-ship.ps1's
# browser phase (#568, migrated to the scaffold classifier in #955).
# scripts/classify_e2e.py is project-scaffolding's classifier copied
# byte-verbatim (`e2e_route.py bootstrap`); every app-launcher routing decision
# lives here. Schema: project-scaffolding docs/e2e-routing.md.
#
# Rules are tried top to bottom, first match wins. A path no rule matches is
# "unclassified" and runs the whole dual-projection suite: uncertainty always
# escalates, never narrows. Labels are echoed into E2E_REASON, and the gate's
# session-host warning keys on the "session-host" labels below, so keep them.
[e2e]
static_pytest_target = "tests/e2e/shell/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# The gate's per-test START/DONE/FAILED history (gitignored): the last 20
# browser runs, appended by scripts/verify-before-ship.ps1 into the PRIMARY
# checkout from whichever checkout ran the gate, because a worktree's own
# webapp/verify-progress.log is overwritten each run and dies with the worktree.
# /e2e-audit reads it for the browser leg's time (fleet-config#1018).
progress_log          = "webapp/verify-progress-history.log"
# Budget for that browser leg, in seconds (#1255): the parallel plus serial
# e2e passes of the latest quiet full-tier run in progress_log, not the whole
# gate. 20 min against ~8.9 min measured 2026-10-03 (508 s parallel + 26 s
# serial; gate total ~12.5 min). The budget is deliberately not ratcheted down
# with the measurement: lowering it is the owner's call (#1376).
# Over it, /e2e fires /e2e-audit; a narrow-routed or overlapped run is
# `unknown`, never `within`. Same rule as test_budget: move it only with a
# written reason.
time_budget_s         = 1200
# Ratchet at the measured size (app-launcher#972, re-audited #1064): this
# repo's dual-projection suite spans six tabs, so the scaffold's 15-test
# target doesn't apply here. Lower this as the suite trims; /e2e-audit
# re-fires when the real count exceeds it again.
#
# This number moves ONLY with an attribution like the one below. A ratchet
# whose number is bumped each time it fires is not a ratchet, it is a log of
# the times we ignored it -- so a raise has to say what the extra nodes are
# FOR, node for node, or the answer was supposed to be a trim.
#
# 2026-09-20 (#1064): fired at 528, re-audited, raised to the measured 638.
# The audit found nothing to trim and the arithmetic closes exactly:
#
#            test fns   x2 projections   + parametrize   = nodes
#   #972          255              510              18       528
#   today         304              608              30       638
#
# +74 test functions added and -25 removed since #972 (net +49, x2 = +98,
# plus 12 new parametrize cases = +110; 638 - 528 = 110). Every new node is
# a new test function times the two browser projections, or a new parametrize
# case. None is unexplained, and none is a duplicate of an existing one.
#
# The -25 is the load-bearing half: each of those was deleted by the very
# commit that removed the feature it covered -- the VS Code button losing 3
# tests as the project menu gained 7 (#977), the send dialog losing 7 as the
# chat composer gained 5 (#993), the session-row gear losing 4 as the kebab
# gained 3 (#1028/#1040). The suite churns with the product rather than
# accreting, which is what makes the +74 legible.
#
# What the +74 bought, all of it surface that did not exist at #972: Chat
# mode inside the session overlay and sending from it (#992, #993), the chat
# transcript staying live (#1068), the Board drawer on the shared composer
# (#994), the project menu and changes viewer (#977), the docked composer
# and keys popover (#990, #1000), Ctrl+Enter send (#1073), Life OS search,
# relevance order and starring (#1077, #1084), the favourite-agent row
# (#1083), and sprite brand marks (#1082).
#
# The redundancy was already harvested, one week before this firing. #956
# (2026-09-13) acted on the #954 audit: it deleted three requests-only
# cache/version copies whose unit twins pinned the same contract, created the
# `chromium_projection_only` fixture, moved readback tests off spawning a PTY,
# and parametrized the board and chief twin pairs -- net -7 test functions.
# #972 then set 528 at that post-trim size. So 528 was already a floor, not a
# comfortable number, and a second sweep seven days later finds nothing
# because the first one took it.
#
# Why it was not trimmed instead. The deterministic scan
# (`e2e_test_audit.py scan`) reports 0 name clusters, 0 parametrize-matrix
# clusters and 0 coverage gaps; the two largest modules were read by hand and
# every test maps to a distinct behaviour. The one real trim available is
# extending the #954 `chromium_projection_only` fixture to the ~3 remaining
# modules with no engine-dependent signal -- about 3 nodes, well under the
# audit's own materiality bar, and not worth the diff. Halving the suite by
# dropping the WebKit projection is NOT available: WebKit is the iPhone
# projection this repo exists for, and a hand-kept single-engine subset is
# the drift-prone under-testing risk the CSS routing note above already
# rejected.
#
# Expect this to fire again within days at the current pace. That is the
# signal working; it is deliberately not padded with headroom to postpone it.
#
# 2026-09-20 (#1098): 638 -> 640. One test function,
# `test_chat_note_spacing.py::test_chat_note_keeps_its_own_air_above_the_transcript`,
# x2 projections = the 2 nodes, no new parametrize cases. It is the standing
# pin for a reported iPhone collision (the detached-session footnote drawn
# against the last line of the transcript) and it is proof, not a guard: both
# of its legs were run red against pre-fix CSS first -- the padding leg, and
# the geometry leg reading 0.0px (Chromium) / 0.7px (WebKit) of separation
# where it now reads 12.0 / 12.7. No existing test measured spacing in the
# chat pane, so nothing was available to extend instead.
# 2026-09-20 (#1100): 640 -> 642. One test function,
# `test_chat_code_block.py::test_chat_fenced_block_is_a_bounded_surface_that_wraps`,
# x2 projections = the 2 nodes, no new parametrize cases. It is the standing
# pin for a second reported iPhone bite in the same pane (a fenced code block
# in a Chat turn rendering as a bare unwrapped strip that panned sideways and
# hid its leading characters) and it is proof, not a guard: both legs were run
# red against pre-fix CSS first -- the surface leg reading `white-space: pre`
# with a transparent background and 0px padding, and the geometry leg reading
# 941px of content in a 321px box (Chromium) / 1027px in 336px (WebKit) where
# it now reads equal. Nothing was available to extend instead: the fenced
# block had no coverage at all, `test_session_transcript.py`'s markdown leg
# asserts `<strong>` and links in one fixed-viewport behavioural test and
# measures no geometry, and `test_markdown_link_rendering.py` is a
# pure-function `renderMarkdown` probe that never paints.
# 2026-09-20 (#1099): 642 -> 644. One test function,
# `test_composer_bottom_parity.py::test_composer_mounts_share_one_bottom_padding_recipe`,
# x2 projections = the 2 nodes, no new parametrize cases. It is the standing
# pin for a third reported iPhone bite in the same pane (Chat leaving a whole
# `env(safe-area-inset-bottom)` more empty space under its button grid than
# Terminal does under the identical grid) and it was run red on both
# projections against pre-fix CSS first, naming the offending declaration
# `#chatComposeBar .compose-bar { padding-bottom: calc(env(...) + 8px) }`.
#
# Unlike the #1098 and #1100 entries above it has NO geometry leg, and that is
# a deliberate limitation rather than an omission: `env(safe-area-inset-bottom)`
# resolves to 0px in headless Chromium and in the WebKit/iPhone projection
# alike, so both mounts already computed to the same 8px bottom padding on
# these engines before the fix -- measured, at 390 and 320 CSS px wide, with
# the textarea empty (92px) and grown (176px), in both modes: 8.0px of gap
# between the control grid and the overlay's bottom edge in every one of the
# 16 combinations, before AND after. No rendered read on any available engine
# can discriminate, so a geometry leg here would assert something that was
# already true and prove nothing. The magnitude is a device reading.
#
# This is the same blind spot that let e8c07f0 (reverted in #1104) pass a full
# green gate while being materially broken on the actual phone, so it is
# written down rather than papered over: a green run of this node means "the
# mount-scoped declaration did not come back", never "the spacing is right".
# Nothing was available to extend instead -- no existing test reads padding or
# geometry on either composer mount.
#
# 2026-09-24 (#1215): fired at 752 after the week's UI sprint (#1124-#1206),
# trimmed to 620 and lowered to it. The trim merged setup-identical tests,
# not behaviour: 752 -> 702 in #1217 (UI polish + terminal modules) and
# 702 -> 620 here (Board, Jobs, Settings, Coding). Every assertion of a
# merged-away test runs verbatim in its survivor, and both PR bodies map
# each one. No projection was dropped from an engine-dependent check and no
# skip was added. The only nodes removed outright were two touch-target
# cluster cases that always skipped, plus the skipped other-engine nodes of
# one-projection tests folded into a sibling's `if browser_name` branch --
# a skipped node counts here and proves nothing. Held back as lower
# confidence and still available: the Life OS / Chat / session group (the
# three readback modules, the compose bar, the keys popover), the phone
# row-tap PTY merge (it would fold the #286 flaky kill leg into a larger
# test), and the smoke-module merges (they would coarsen the static tier).
#
# 2026-09-25 (#1220 step 2): 620 -> 436, and the "dropping the WebKit
# projection is NOT available" note under #1064 is superseded by Roberto's
# decision on #1220. WebKit/iPhone now runs only for tests carrying the
# `iphone` marker (layout and geometry, touch targets, nav, the composer and
# keyboard input, safe-area, engine branches); every other test's WebKit node
# is deselected at collection (`tests/e2e/conftest.py`). No test function was
# removed and Chromium coverage is unchanged: 620 = 310 Chromium + 310 WebKit
# nodes before, 310 Chromium + 126 WebKit = 436 after, 184 WebKit nodes
# deselected. The drift risk the old note named (a hand-kept single-engine
# subset) is what `tests/unit/repo/test_e2e_iphone_projection.py` answers: a test that
# measures layout, taps or reads `browser_name` without the marker fails the
# build. Basis, from #1220's measurement: 0 WebKit-engine product bugs in 400
# PRs, WebKit was 61% of browser time, and iOS-only bugs don't reproduce in
# desktop WebKit either, so the real iPhone check stays on the device.
#
# 2026-10-02 (#1372): 436 -> 485, the measured `pytest --collect-only -q
# tests/e2e` count. The budget trigger fired from the #1371 finish (a
# docs-only change that added no tests): the 436 above was set on 2026-09-26
# and the suite grew 49 nodes in the week of feature work since. The
# `/e2e-audit` scan found 0 name clusters and 0 parametrize-matrix clusters,
# so there is nothing to merge. Attribution: 16 of the 49 are three new
# modules (`test_session_changed_files.py` #1357, `test_chat_step_diffs.py`
# #1355, `test_compose_attach_progress.py` #1362); the other 33 are tests
# added to existing modules by the feature and fix PRs of that week (#1294
# Chat pull-to-load, #1296/#1299 Board answer sheet, #1315 Chat resume card,
# #1304 last-tab memory, #1305 Large-text clipping check, and similar) -- not
# traced node for node in this run. Held at the measured size with no
# headroom; the next fixer should trim, not raise, using a full `timing` /
# `failures` pass (browser leg was 572 s against the 1200 s budget).
test_budget = 485

# --- static assets under the webapp's static dir -> Chromium smoke ----------
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]
label      = "static-asset"
# A vendored HTML *fragment* (e.g. the icons sprite) is pure markup the smoke
# suite loads, with no behaviour of its own. Non-vendored .html (index.html)
# is a real app page, as is a view fragment under views/, and both fall through
# to full below.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]
label      = "static-asset"

# --- the real browser surface -> full ---------------------------------------
# CSS routes full rather than to a curated "layout subset": styles/*.css is
# global and WebKit is exactly where layout regressions surface, so a
# hand-kept subset would be drift-prone and an under-testing risk.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/static/"
label  = "webapp-static-code"
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"
label  = "webapp"

# --- session-host / launcher on the e2e surface -> full ---------------------
# The e2e suite drives a live session-host, so every module it loads is
# browser surface: the CLAUDE.md `## session-host` import closure (#881, #923),
# plus the launcher entry points. Kept as literal paths rather than parsed
# from CLAUDE.md at classify time on purpose -- a parse failure would narrow
# routing silently. tests/unit/repo/test_classify_e2e.py walks that CLAUDE.md block and
# fails when a declared path stops routing full.
[[e2e.rule]]
tier   = "full"
