# [design] wide_views -- tabs whose content is two-dimensional (the Board's lanes) may
# span the window; every other tab keeps the 772px measure. design.md Layout:
# width follows the shape of the view (fleet-config#1113).
[design]
wide_views = ["board"]

# [design.review] -- the rendered design review's walk (fleet-config
# skills/_lib/design_review, docs/skills.md "Two legs, two interpreters").
# The walk clicks the primary tabs, opens every <details> and showModal()s
# every dialog[id] on its own; each extra step below is a click (or a short
# `clicks` sequence) after a fresh load, never a fill or submit, and never on
# or inside a no_go selector. A step whose target is missing on the live app
# (an empty list) is recorded STEP_TARGET_ABSENT and leaves unrelated rules
# alone (fleet-config#995). Anything inside the session overlay needs a
# session the walk must never attach to on the live app: those steps are
# `synthetic = true` and run only against the throwaway instance below.
[design.review]
theme_storage_key = "app-launcher.theme"
# No tab_selector: the walk resolves it *inside* the first [role=tablist], so
# the default [role=tab] is right and "[role=tablist] [role=tab]" matches
# nothing (every tab click timed out on the first run with it).
# Never clicked: every danger item (Kill, Stop, Delete, Remove), every row
# tap (launches an agent or opens an app), anything that sends, dispatches,
# runs, starts or resumes (a Life skill's Telegram items start or open a
# real bot), and card taps that open a URL.
no_go = [
    ".row-menu-danger",
    ".action-row-main",
    ".session-open",
    ".job-run-btn",
    ".board-drawer-action",
    ".board-stop-btn",
    ".board-issue-btn",
    ".board-item:not([data-session-id]) .board-card",
    "#boardDispatchSend",
    "#boardChiefStart",
    "#boardChiefResume",
    "#codingChiefStart",
    "#codingChiefResume",
    "#claudeResume",
    "#lifeOsRecapLaunch",
    "#lifeOsResume",
    ".lifeos-channel-btn",
]

[[design.review.extra_steps]]
tab = "claude"
id = "settings"
click = "#settingsOpen"

[[design.review.extra_steps]]
tab = "claude"
id = "session-menu"
click = "#sessionsList .session-kebab"

[[design.review.extra_steps]]
tab = "board"
id = "drawer"
click = ".board-item[data-session-id] .board-card"

[[design.review.extra_steps]]
tab = "lifeos"
id = "skill-menu"
click = ".lifeos-menu-anchor"

# A skill's conversations (#1504) read its private index, so these two run on
# the synthetic instance only; the chevron opens the conversation sheet
# (a row's main tap stays in no_go).
[[design.review.extra_steps]]
tab = "lifeos"
id = "conversations"
clicks = [".lifeos-menu-anchor", ".lifeos-convo-btn"]
synthetic = true

[[design.review.extra_steps]]
tab = "lifeos"
id = "conversation-sheet"
clicks = [".lifeos-menu-anchor", ".lifeos-convo-btn", ".lifeos-convo-chevron"]
synthetic = true

[[design.review.extra_steps]]
tab = "jobs"
id = "job-menu"
click = ".job-menu-anchor"

[[design.review.extra_steps]]
tab = "jobs"
id = "filter"
click = "#jobsSearchInput"

# The throwaway instance `/design-review app-launcher --synthetic` walks
# (fleet-config#995, app-launcher#1227): a git-archive copy of HEAD on free
# ports with synthetic data only -- a demo project, a stub PTY session with a
# synthetic Chat transcript, one Life OS skill, one job, one app. Its no_go is
# the live list with `.board-drawer-action` narrowed to Rename, so the drawer's
# Chat and Terminal open on the stub session while Stop, Issue and Rename stay
# vetoed; `.session-open` stays vetoed because a desktop row tap mirrors the
# session into a window on the PC. `.action-row-main` is vetoed except on a Board
# session card, whose main tap only toggles the drawer (#1433, #1502): with the
# whole class vetoed the Chat and Terminal steps were refused NO_GO and COMP-18
# read unmeasured (#1633).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 180
no_go = [
    ".row-menu-danger",
    ".action-row-main:not(.board-card-session)",
    ".session-open",
    ".job-run-btn",
    ".board-rename-btn",
    ".board-stop-btn",
    ".board-issue-btn",
    ".board-item:not([data-session-id]) .board-card",
    "#boardDispatchSend",
    "#boardChiefStart",
    "#boardChiefResume",
    "#codingChiefStart",
    "#codingChiefResume",
    "#claudeResume",
    "#lifeOsRecapLaunch",
    "#lifeOsResume",
    ".lifeos-channel-btn",
]

# `measure --e2e` runs the e2e suite with the surface() hook armed (#1698). A bare
# run would meet the live-tray guard (it refuses while :8445 is occupied), so
# autoboot is explicit; the suite then boots its own disposable webapp + session-host.
[design.review.e2e]
command = ["-m", "pytest", "tests/e2e", "--e2e-autoboot", "-q"]
timeout_s = 1500

[[design.review.extra_steps]]
tab = "board"
id = "session-chat"
clicks = [".board-item[data-session-id] .board-card", ".board-open-chat"]
synthetic = true

[[design.review.extra_steps]]
tab = "board"
id = "session-terminal"
clicks = [".board-item[data-session-id] .board-card", ".board-open-terminal"]
synthetic = true

[[design.review.extra_steps]]
tab = "board"
id = "session-overlay-menu"
clicks = [".board-item[data-session-id] .board-card", ".board-open-terminal", "#terminalMenu"]
synthetic = true

