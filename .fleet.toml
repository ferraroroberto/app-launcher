# ---------------------------------------------------------------------------
# [e2e] -- diff-proportionate routing for scripts/verify-before-ship.ps1's
# browser phase (#568, migrated to the scaffold classifier in #955).
# scripts/classify_e2e.py is project-scaffolding's classifier copied
# byte-verbatim (`e2e_route.py bootstrap`); every app-launcher routing decision
# lives here. Schema: project-scaffolding docs/e2e-routing.md.
#
# Rules are tried top to bottom, first match wins. A path no rule matches is
# "unclassified" and runs the whole dual-projection suite: uncertainty always
# escalates, never narrows. Labels are echoed into E2E_REASON, and the gate's
# session-host warning keys on the "session-host" labels below, so keep them.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# Ratchet at the measured size (app-launcher#972, re-audited #1064): this
# repo's dual-projection suite spans six tabs, so the scaffold's 15-test
# target doesn't apply here. Lower this as the suite trims; /e2e-audit
# re-fires when the real count exceeds it again.
#
# This number moves ONLY with an attribution like the one below. A ratchet
# whose number is bumped each time it fires is not a ratchet, it is a log of
# the times we ignored it -- so a raise has to say what the extra nodes are
# FOR, node for node, or the answer was supposed to be a trim.
#
# 2026-09-20 (#1064): fired at 528, re-audited, raised to the measured 638.
# The audit found nothing to trim and the arithmetic closes exactly:
#
#            test fns   x2 projections   + parametrize   = nodes
#   #972          255              510              18       528
#   today         304              608              30       638
#
# +74 test functions added and -25 removed since #972 (net +49, x2 = +98,
# plus 12 new parametrize cases = +110; 638 - 528 = 110). Every new node is
# a new test function times the two browser projections, or a new parametrize
# case. None is unexplained, and none is a duplicate of an existing one.
#
# The -25 is the load-bearing half: each of those was deleted by the very
# commit that removed the feature it covered -- the VS Code button losing 3
# tests as the project menu gained 7 (#977), the send dialog losing 7 as the
# chat composer gained 5 (#993), the session-row gear losing 4 as the kebab
# gained 3 (#1028/#1040). The suite churns with the product rather than
# accreting, which is what makes the +74 legible.
#
# What the +74 bought, all of it surface that did not exist at #972: Chat
# mode inside the session overlay and sending from it (#992, #993), the chat
# transcript staying live (#1068), the Board drawer on the shared composer
# (#994), the project menu and changes viewer (#977), the docked composer
# and keys popover (#990, #1000), Ctrl+Enter send (#1073), Life OS search,
# relevance order and starring (#1077, #1084), the favourite-agent row
# (#1083), and sprite brand marks (#1082).
#
# The redundancy was already harvested, one week before this firing. #956
# (2026-09-13) acted on the #954 audit: it deleted three requests-only
# cache/version copies whose unit twins pinned the same contract, created the
# `chromium_projection_only` fixture, moved readback tests off spawning a PTY,
# and parametrized the board and chief twin pairs -- net -7 test functions.
# #972 then set 528 at that post-trim size. So 528 was already a floor, not a
# comfortable number, and a second sweep seven days later finds nothing
# because the first one took it.
#
# Why it was not trimmed instead. The deterministic scan
# (`e2e_test_audit.py scan`) reports 0 name clusters, 0 parametrize-matrix
# clusters and 0 coverage gaps; the two largest modules were read by hand and
# every test maps to a distinct behaviour. The one real trim available is
# extending the #954 `chromium_projection_only` fixture to the ~3 remaining
# modules with no engine-dependent signal -- about 3 nodes, well under the
# audit's own materiality bar, and not worth the diff. Halving the suite by
# dropping the WebKit projection is NOT available: WebKit is the iPhone
# projection this repo exists for, and a hand-kept single-engine subset is
# the drift-prone under-testing risk the CSS routing note above already
# rejected.
#
# Expect this to fire again within days at the current pace. That is the
# signal working; it is deliberately not padded with headroom to postpone it.
#
# 2026-09-20 (#1098): 638 -> 640. One test function,
# `test_chat_note_spacing.py::test_chat_note_keeps_its_own_air_above_the_transcript`,
# x2 projections = the 2 nodes, no new parametrize cases. It is the standing
# pin for a reported iPhone collision (the detached-session footnote drawn
# against the last line of the transcript) and it is proof, not a guard: both
# of its legs were run red against pre-fix CSS first -- the padding leg, and
# the geometry leg reading 0.0px (Chromium) / 0.7px (WebKit) of separation
# where it now reads 12.0 / 12.7. No existing test measured spacing in the
# chat pane, so nothing was available to extend instead.
# 2026-09-20 (#1100): 640 -> 642. One test function,
# `test_chat_code_block.py::test_chat_fenced_block_is_a_bounded_surface_that_wraps`,
# x2 projections = the 2 nodes, no new parametrize cases. It is the standing
# pin for a second reported iPhone bite in the same pane (a fenced code block
# in a Chat turn rendering as a bare unwrapped strip that panned sideways and
# hid its leading characters) and it is proof, not a guard: both legs were run
# red against pre-fix CSS first -- the surface leg reading `white-space: pre`
# with a transparent background and 0px padding, and the geometry leg reading
# 941px of content in a 321px box (Chromium) / 1027px in 336px (WebKit) where
# it now reads equal. Nothing was available to extend instead: the fenced
# block had no coverage at all, `test_session_transcript.py`'s markdown leg
# asserts `<strong>` and links in one fixed-viewport behavioural test and
# measures no geometry, and `test_markdown_link_rendering.py` is a
# pure-function `renderMarkdown` probe that never paints.
# 2026-09-20 (#1099): 642 -> 644. One test function,
# `test_composer_bottom_parity.py::test_composer_mounts_share_one_bottom_padding_recipe`,
# x2 projections = the 2 nodes, no new parametrize cases. It is the standing
# pin for a third reported iPhone bite in the same pane (Chat leaving a whole
# `env(safe-area-inset-bottom)` more empty space under its button grid than
# Terminal does under the identical grid) and it was run red on both
# projections against pre-fix CSS first, naming the offending declaration
# `#chatComposeBar .compose-bar { padding-bottom: calc(env(...) + 8px) }`.
#
# Unlike the #1098 and #1100 entries above it has NO geometry leg, and that is
# a deliberate limitation rather than an omission: `env(safe-area-inset-bottom)`
# resolves to 0px in headless Chromium and in the WebKit/iPhone projection
# alike, so both mounts already computed to the same 8px bottom padding on
# these engines before the fix -- measured, at 390 and 320 CSS px wide, with
# the textarea empty (92px) and grown (176px), in both modes: 8.0px of gap
# between the control grid and the overlay's bottom edge in every one of the
# 16 combinations, before AND after. No rendered read on any available engine
# can discriminate, so a geometry leg here would assert something that was
# already true and prove nothing. The magnitude is a device reading.
#
# This is the same blind spot that let e8c07f0 (reverted in #1104) pass a full
# green gate while being materially broken on the actual phone, so it is
# written down rather than papered over: a green run of this node means "the
# mount-scoped declaration did not come back", never "the spacing is right".
# Nothing was available to extend instead -- no existing test reads padding or
# geometry on either composer mount.
test_budget = 644

# --- static assets under the webapp's static dir -> Chromium smoke ----------
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]
label      = "static-asset"
# A vendored HTML *fragment* (e.g. the icons sprite) is pure markup the smoke
# suite loads, with no behaviour of its own. Non-vendored .html (index.html)
# is a real app page and falls through to full below.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]
label      = "static-asset"

# --- the real browser surface -> full ---------------------------------------
# CSS routes full rather than to a curated "layout subset": styles.css is
# global and WebKit is exactly where layout regressions surface, so a
# hand-kept subset would be drift-prone and an under-testing risk.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/static/"
label  = "webapp-static-code"
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"
label  = "webapp"

# --- session-host / launcher on the e2e surface -> full ---------------------
# The e2e suite drives a live session-host, so every module it loads is
# browser surface: the CLAUDE.md `## session-host` import closure (#881, #923),
# plus the launcher entry points. Kept as literal paths rather than parsed
# from CLAUDE.md at classify time on purpose -- a parse failure would narrow
# routing silently. tests/test_classify_e2e.py walks that CLAUDE.md block and
# fails when a declared path stops routing full.
[[e2e.rule]]
tier   = "full"
prefix = "app/session_host/"
label  = "session-host"
[[e2e.rule]]
tier = "full"
path = "src/session_client.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/launcher.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/vt_snapshot.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/__init__.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/agents.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/app_config.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/audit.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/build_info.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/diagnostics.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/env_path.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/git_utils.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/subprocess_flags.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "launcher.py"
label = "session-host/launcher"
# A prefix, not a list, so a future split of the session host
# (e.g. src/session_host_pty.py) routes full without an edit here.
[[e2e.rule]]
tier       = "full"
prefix     = "src/session_host"
extensions = ["py"]
label      = "session-host/launcher"

# --- the e2e suite itself, and the shared root conftest -> full -------------
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
label  = "e2e-test"
[[e2e.rule]]
tier  = "full"
path  = "tests/conftest.py"
label = "shared-conftest"

# --- no browser impact -> no browser suite ----------------------------------
# Deliberate #568 decision, not an oversight: backend src/ code off the
# session-host path has no browser surface of its own. The non-e2e pytest
# suite (TestClient etc.) covers it, and that phase always runs. Do not
# "fix" this by routing all of src/ to full.
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]
label      = "backend-python"
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]
label      = "non-e2e-test"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
label      = "docs"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
label  = "docs"
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
label  = "tooling/config"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
label  = "tooling/config"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"
label  = "tooling/config"
[[e2e.rule]]
tier  = "none"
path  = ".fleet.toml"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = ".gitignore"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = "LICENSE"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = "AGENTS.md"
label = "repo-meta"
[[e2e.rule]]
tier  = "none"
path  = "CLAUDE.md"
label = "repo-meta"
[[e2e.rule]]
tier       = "none"
extensions = ["bat"]
label      = "repo-meta"

# --- surfaces (#955, project-scaffolding#258) -------------------------------
# A diff that would route "full" but whose every full- or static-tier path
# sits in ONE surface below runs only that surface's pytest_targets, on both
# projections. A surface owns a tab's own modules and its own tests, nothing
# shared: styles.css, index.html, main.js/state.js/api.js/tabs.js and the other
# shared JS, server.py, the session-host paths and both conftests stay out of
# every surface, so a change there still runs the whole suite. So do a path in
# two surfaces, a diff spanning two, any unclassified path, and any diff that
# edits this file or the classifier.
#
# Targets are wider than the owned tests on purpose. Each tab module is
# imported by main.js, so a broken one takes the whole SPA down: test_smoke,
# test_primary_nav and test_bottom_tab_bar catch that. test_coding_model_selector
# drives both tabs' model combos (claude-options.js imports them), and
# test_terminal_bar_overflow shares the terminal bar's classes with the Life OS
# doc-browser bar and mirrors the board carousel's overflow pattern.
# tests/test_classify_e2e.py pins every surface with a narrowing path and a
# shared path that must stay full, and checks that every e2e test naming a
# surface module is in that surface's targets.

# The Board tab: kanban + drawer (board.js), the dispatch bar and fleet-chief
# lifecycle (board-dispatch.js), and their routers. test_coding_chief drives the
# chief from the Coding tab through board-dispatch.js; test_session_rename and
# test_shared_session_title render board cards.
[[e2e.surface]]
name     = "board"
paths    = [
    "app/webapp/static/board.js",
    "app/webapp/static/board-dispatch.js",
    "app/webapp/routers/board.py",
    "app/webapp/routers/board_chief.py",
    "app/webapp/routers/board_spawn.py",
    "tests/e2e/test_board_tab.py",
    "tests/e2e/test_board_chief.py",
]
pytest_targets = [
    "tests/e2e/test_board_tab.py",
    "tests/e2e/test_board_chief.py",
    "tests/e2e/test_page_headers.py",
    "tests/e2e/test_text_size.py",
    "tests/e2e/test_wide_layout.py",
    "tests/e2e/test_wide_code_detail.py",
    "tests/e2e/test_coding_chief.py",
    "tests/e2e/test_session_rename.py",
    "tests/e2e/test_shared_session_title.py",
    "tests/e2e/test_coding_model_selector.py",
    "tests/e2e/test_terminal_bar_overflow.py",
    "tests/e2e/test_primary_nav.py",
    "tests/e2e/test_bottom_tab_bar.py",
    "tests/e2e/test_smoke.py",
    "tests/e2e/test_row_name_typography.py",
    "tests/e2e/test_icon_sizes.py",
    "tests/e2e/test_vendored_empty_and_select.py",
    "tests/e2e/test_touch_targets.py",
]

