# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "🚀"
port        = ":8445"
description = "<b>Where I live</b> — phone-first hub: Coding · Apps · Jobs · Life OS · Board."
shape       = "webapp-tray"
# `webapp/` holds the gitignored runtime state the tray writes (briefs, verify logs,
# certificates); the preset lists `assets/` and `config/` already.
extra_roots = ["webapp"]

# ---------------------------------------------------------------------------
# [worktree] -- gitignored paths fleet-config junctions from this primary
# checkout into every fresh worktree it cuts (skills/_lib/worktree_claim.py's
# `worktree_junction_targets`). `.venv` is always included; the declaration
# below adds the HTTPS cert pair.
#
# Why (#1080): `git worktree add` populates tracked files only, and
# `webapp/certificates/` is gitignored, so a side instance stood up out of a
# worktree served a self-signed-warning page and a broken WebAuthn flow -- a
# failure that reads like a bug in the change under test. A junction rather
# than a copy because the certs are read-only at runtime: a regenerated cert
# reaches every live worktree with no re-provisioning.
#
# A declared path that is absent in the primary is skipped rather than failing
# setup, and `remove-worktree` strips the junction reparse-safely before any
# delete -- never `git worktree remove` a worktree holding one, git's
# recursive delete follows it into the primary's real target
# (fleet-config#847).
[worktree]
extra_junctions = ["webapp/certificates"]

[vendored]
icons = { src = "app/webapp/static/_vendored/icons", sha = "5d460bd1d9d44eed955c5357d1c9f622f2550ad8", dest = "app/webapp/static/_vendored/icons" }
