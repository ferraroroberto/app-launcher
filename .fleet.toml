# --- the CLI dispatcher and the dependency pins -> full ---------------------
# The e2e session-host starts as `launcher.py session-host`, and the webapp's
# jobs router imports app.cli.commands.run_job_cmd. Either import runs
# app/cli/commands/__init__.py, which imports every command module, so a broken
# one stops the disposable stack booting. A pin bump is installed into the venv
# the browser run uses, so it is browser surface too. Both were "unclassified"
# and already ran full; the rules name that.
