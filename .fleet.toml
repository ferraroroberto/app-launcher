label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/__init__.py"
label = "session-host/launcher"
[[e2e.rule]]
tier = "full"
path = "src/agents.py"
label = "session-host/launcher"
[[e2e.rule]]
